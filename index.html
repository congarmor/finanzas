<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mis finanzas</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--sep:#d8d8de;--accent:#0a7cff;--neg:#d70015;--pos:#248a3d;--nav:rgba(255,255,255,.94);--head:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#8e8e93;--sep:#38383a;--accent:#0a84ff;--neg:#ff453a;--pos:#30d158;--nav:rgba(28,28,30,.94);--head:#1c1c1e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--head);border-bottom:1px solid var(--sep);padding:10px 14px;display:flex;align-items:center;gap:8px;min-height:52px}
header.top h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:none;border:0;color:var(--accent);font:inherit;padding:8px;cursor:pointer;border-radius:8px}
.btn.primary{background:var(--accent);color:#fff;border-radius:20px;padding:6px 14px;font-weight:600}
.btn.danger{color:var(--neg)}
main{max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
nav.tabs button .g{font-size:26px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700;border-top-color:var(--accent);background:rgba(10,124,255,.08)}
.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:18px 16px 6px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--card);margin:0 12px;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--sep);cursor:pointer;min-height:56px;list-style:none}
.row:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;font-size:15px}
.mid{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt small{display:block;font-size:12px;color:var(--muted)}
.neg{color:var(--neg)}
.pos{color:var(--pos)}
.hero{margin:12px;padding:18px;border-radius:14px;background:linear-gradient(135deg,#0a7cff,#5e5ce6);color:#fff}
.hero .l{font-size:14px;opacity:.85}
.hero .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px}
.month{display:flex;align-items:center;justify-content:center;font-weight:600;flex:1;text-transform:capitalize}
.field{width:100%;margin:6px 12px;padding:9px 12px;border-radius:10px;border:0;background:var(--card);color:var(--text);font:inherit;outline:none}
.day{display:flex;justify-content:space-between;padding:14px 16px 6px;font-size:13px;color:var(--muted);text-transform:capitalize}
.banner{margin:10px 12px;padding:10px 12px;border-radius:10px;background:#ffd60a44;font-size:14px}
.empty{padding:24px 18px;text-align:center;color:var(--muted);font-size:14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.bar2{height:5px;border-radius:3px;background:var(--sep);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.sub{padding:6px 14px 8px 60px;background:var(--card);border-bottom:1px solid var(--sep);font-size:14px}
.sub div{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--head);position:sticky;top:0;border-bottom:1px solid var(--sep);gap:8px}
.fld{background:var(--card);margin:10px 12px 0;border-radius:12px;overflow:hidden}
.fr{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sep);gap:10px}
.fr:last-child{border-bottom:0}
.fr>label{flex:none;width:92px;color:var(--muted);font-size:15px}
.fr input,.fr select{flex:1;border:0;background:transparent;outline:none;min-width:0;text-align:right;font:inherit;font-size:16px;color:var(--text)}
.fr input.big{font-size:24px;font-weight:600}
.seg{display:flex;background:var(--sep);border-radius:9px;padding:2px;margin:12px 12px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;font:inherit;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);font-weight:600}
.hide{display:none!important}
@media (min-width:700px){#ov{align-items:center}#sheet{border-radius:16px;max-height:88vh;margin:20px}}
.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:3px;line-height:1.35;word-break:break-word}
.fr textarea{flex:1;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--text);resize:vertical;min-height:70px;text-align:left;min-width:0}
.ipick{font-size:22px;padding:4px 6px;border-radius:8px;background:none;border:1px solid var(--sep);cursor:pointer}
.ipick.on{background:var(--accent);border-color:var(--accent)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;pointer-events:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.printonly{display:none}
.rr[data-tx]{cursor:pointer}.rr[data-tx]:active{background:var(--bg)}.ri{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;margin-top:1px}.ic.soft{font-size:21px}.ic.logo{object-fit:cover;background:#fff}.ic svg{display:block}
.rr{display:flex;align-items:flex-start;gap:8px;padding:5px 12px;border-bottom:1px solid var(--sep);font-size:14px;line-height:1.25}
.rr:last-child{border-bottom:0}
.rr .rd{flex:none;width:72px;color:var(--muted);font-size:12px;padding-top:2px}
.rr .mid{flex:1;min-width:0}
.rr .t1{font-size:14px;white-space:normal}
.rr .t2{font-size:12px;white-space:normal}
.rr .amt{font-size:14px;white-space:nowrap}
.rs{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-left:10px}
.cathead{display:flex;justify-content:space-between;padding:8px 14px 2px;font-weight:700;font-size:14px}
.subhead{display:flex;justify-content:space-between;padding:4px 14px 2px 22px;font-weight:600;font-size:13px;color:var(--muted)}
.mx{overflow-x:auto;margin:0 12px 8px;background:var(--card);border-radius:12px}
.mx table{border-collapse:collapse;font-size:12px;width:100%}
.mx th,.mx td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--sep);white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.mx .indent{padding-left:16px}
.mx .tophead th,.mx .tophead td{font-weight:700}
.mx .totalrow th,.mx .totalrow td{font-weight:700;border-top:2px solid var(--sep)}
@media print{header.top,nav.tabs,.noprint,#hact,#ov,.banner{display:none!important}.printonly{display:block!important}body{padding:0!important;background:#fff!important;color:#000!important;font-size:11px}.card{box-shadow:none!important;border:1px solid #bbb;margin:0 0 6px!important}.hero{background:#eee!important;color:#000!important;margin:6px 0!important;padding:8px!important}.hero .v{font-size:18px!important}.rr{padding:1px 4px!important;font-size:10px!important;line-height:1.15!important;break-inside:avoid}.rr .t1,.rr .amt{font-size:10px!important}.rr .t2,.rs,.rr .rd{font-size:9px!important}.sec{padding:8px 0 2px!important;font-size:11px!important}.cathead,.subhead{font-size:10px!important;padding:3px 4px!important}.mx{overflow:visible!important;margin:0!important}.mx table{font-size:9px!important}.mx th,.mx td{padding:1px 3px!important}}
</style>
</head>

  while (p && p.parent != null && guard++ < 10) { if (p.parent === anc) return true; p = catMap.get(p.parent); }
  return false;
}
function refundsOf(id){ return refMap.get(id) || []; }
function refundCat(t){
  if (t.category) return t.category;
  const ex = txMap.get(t.refundOf);
  if (ex && ex.splits && ex.splits.length) return ex.splits[0].category;
  return ex ? ex.category : null;
}
function exLabel(ex){ const cl = ex.splits ? 'varias categorías' : catLabel(ex.category); return `${fmtDate(ex.date)} · ${ex.payee || cl} · ${money(Math.abs(ex.amount))}`; }
function refOptions(){
  return S.transactions.filter(t => t.type === 'gasto').sort((a,b) => byAsc(b,a)).map(t => `<option value="${esc(exLabel(t) + ' (' + t.id + ')')}">`).join('');
}
function refIdFromLabel(raw){ const m = String(raw || '').match(/\((\d+)\)\s*$/); return m ? Number(m[1]) : null; }
function isFuture(t){ return t.date > todayStr(); }
function included(a){ return (a.inNetWorth || a.type === 'inversion') && !a.archived; }
let pmsg = '';
let reorder = false;
function ordered(){ const pos = new Map((S.accountOrder || []).map((id,i) => [id,i])); return [...S.accounts].sort((a,b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9)); }
function secKey(a){ return a.archived ? 'arch' : !included(a) ? 'fuera' : a.type === 'inversion' ? 'inv' : a.group === 'Entidades' ? 'ent' : 'efe'; }
function moveAcc(id, dir){
  const list = ordered();
  const i = list.findIndex(a => a.id === id); if (i < 0) return;
  const key = secKey(list[i]);
  let j = i + dir;
  while (j >= 0 && j < list.length && secKey(list[j]) !== key) j += dir;
  if (j < 0 || j >= list.length) return;
  const ids = list.map(a => a.id);
  [ids[i], ids[j]] = [ids[j], ids[i]];
  S.accountOrder = ids; save(); render();
}
function trend(v){ const r = Math.round(v*100)/100; return r > 0 ? 'pos' : r < 0 ? 'neg' : ''; }
function fmtSigned(v, dec){ return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('es-ES', {minimumFractionDigits: dec, maximumFractionDigits: dec}); }
function holdingText(x){
  const val = holdingValue(x);
  let mid = `${esc(x.name)} · ${x.shares} × ${fmtPrice(x.price)}`;
  let line2 = '';
  if (x.prevClose) {
    const d = x.price - x.prevClose, p = d / x.prevClose * 100;
    line2 = `<span class="${trend(d)}">${d > 0 ? '▲' : d < 0 ? '▼' : '■'} ${fmtSigned(d,2)} € (${fmtSigned(p,2)} %) hoy</span>`;
  }
  line2 += (line2 ? ' · ' : '') + (x.priceDate ? fmtDate(x.priceDate) : 'precio manual');
  let amt = money(val);
  if (x.cost) {
    const g = val - x.cost, gp = g / x.cost * 100;
    amt += `<small class="${trend(g)}">${g > 0 ? '▲' : g < 0 ? '▼' : ''} ${fmtSigned(g,2)} € (${fmtSigned(gp,1)} %) vs compra</small>`;
  }
  return {mid, line2, amt};
}
function holdingsOf(accId){ return (S.holdings || []).filter(h => h.account === accId); }
function holdingValue(h){ return h.shares * h.price; }
function accTotal(a, b){ let v = b.get(a.id) || 0; if (a.type === 'inversion') holdingsOf(a.id).forEach(h => { v += holdingValue(h); }); return v; }
function fmtPrice(p){ return p.toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 3}) + ' €'; }
function fmtDate(s){ const [y,m,d] = s.split('-'); return Number(d) + '/' + Number(m) + '/' + y; }
function dayOf(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()); }
function sign(v){ const r = Math.round(v*100)/100; return r < 0 ? 'neg' : r > 0 ? 'pos' : ''; }
function balances(){
  const b = new Map();
  S.accounts.forEach(a => b.set(a.id, a.opening));
  S.transactions.forEach(t => { if (!isFuture(t)) b.set(t.account, (b.get(t.account) || 0) + t.amount); });
  return b;
}

/* ---------- Cuentas ---------- */
function viewAccounts(){
  const b = balances();
  const inc = ordered().filter(included);
  const efectivo = inc.filter(a => a.type !== 'inversion').reduce((s,a) => s + accTotal(a,b), 0);
  const inv = inc.filter(a => a.type === 'inversion').reduce((s,a) => s + accTotal(a,b), 0);
  const groups = [
    ['Entidades', a => included(a) && a.type !== 'inversion' && a.group === 'Entidades', true],
    ['Efectivo y tarjetas', a => included(a) && a.type !== 'inversion' && a.group !== 'Entidades', true],
    ['Inversión', a => included(a) && a.type === 'inversion', true],
    ['Fuera del patrimonio · no suma', a => !included(a) && !a.archived, false],
    ['Archivadas · no suma', a => a.archived, false]
  ];
  let h = `<div class="bar" style="justify-content:flex-end"><button class="btn" data-act="reorder">${reorder ? 'Listo' : 'Ordenar cuentas'}</button></div><div class="hero"><div class="l">Patrimonio neto</div><div class="v">${money(efectivo + inv)}</div><div class="l" style="margin-top:8px">Efectivo ${money(efectivo)} · Inversiones ${money(inv)}</div></div>`;
  for (const [title, fn, withSum] of groups) {
    const list = ordered().filter(fn);
    if (!list.length) continue;
    const sum = list.reduce((s,a) => s + accTotal(a,b), 0);
    h += `<div class="sec"><span>${title}</span>${withSum ? `<span>${money(sum)}</span>` : ''}</div><div class="card">`;
    h += list.map(a => {
      const v = accTotal(a,b);
      const tags = [a.archived ? 'archivada' : '', !included(a) ? 'fuera del patrimonio' : ''].filter(Boolean).join(' · ');
      const mv = reorder ? `<div style="display:flex;flex-direction:column"><button class="btn" data-move="-1" data-acc="${a.id}">▲</button><button class="btn" data-move="1" data-acc="${a.id}">▼</button></div>` : '';
      let r = `<div class="row" ${reorder ? `draggable="true" data-drag="${a.id}" style="cursor:grab"` : `data-go="movimientos" data-acc="${a.id}"`}>${bankLogo(a) || `<div class="ic" style="background:${colorOf(a.name)}">${esc((a.name||'?')[0].toUpperCase())}</div>`}<div class="mid"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(ACC_LABEL[a.type] || '')}${tags ? ' · ' + tags : ''}</div></div><div class="amt ${sign(v)}">${money(v)}</div>${mv}</div>`;
      if (a.type === 'inversion') {
        r += holdingsOf(a.id).map(x => { const ht = holdingText(x); return `<div class="row" data-hprice="${x.id}" style="padding:8px 14px 8px 60px;min-height:0;background:var(--bg)"><div class="mid"><div class="t2">${ht.mid}</div><div class="t2">${ht.line2}</div></div><div class="amt">${ht.amt}</div></div>`; }).join('');
      }
      return r;
    }).join('');
    h += '</div>';
  }
  h += `<div class="empty">${esc(pmsg)}${S.holdings && S.holdings.length ? ' <button class="btn" data-act="prices">Actualizar precios</button>' : ''}</div>`;
  return h;
}

/* ---------- Movimientos ---------- */
function selTotal(){ return [...SEL].reduce((s,id) => s + ((txMap.get(id) || {}).amount || 0), 0); }
function qSummary(){
  const list = VIS.map(id => txMap.get(id)).filter(t => t && !isFuture(t));
  const tot = list.reduce((s,t) => s + t.amount, 0);
  return `<div class="card" style="margin:8px 12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="t1">${list.length} apuntes</div><div class="t2">Total <span class="${sign(tot)}"><strong>${money(tot)}</strong></span></div></div><button class="btn" data-act="toreport">Ver como informe</button></div>`;
}
function selBar(){
  return `<div class="card" style="margin:8px 12px;padding:10px 12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong>${SEL.size} seleccionados</strong><span class="${sign(selTotal())}"><strong>${money(selTotal())}</strong></span></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><button class="btn" data-act="selall">Todas las visibles (${VIS.length})</button><button class="btn" data-act="selnone">Ninguna</button><button class="btn" data-act="selcat">Cambiar categoría</button><button class="btn danger" data-act="seldel">Eliminar</button></div></div>`;
}
function selCatOpen(){
  if (!SEL.size) { alert('Selecciona antes algún apunte'); return; }
  $('#sheet').innerHTML = `<div class="hd"><button class="btn" data-act="cancel">Cancelar</button><strong>Cambiar categoría</strong><button class="btn primary" data-act="selcatapply">Aplicar</button></div><div class="fld"><div class="fr"><label>Categoría</label><select id="sc_cat">${catOptsHtml(null)}</select></div></div><div class="empty">Se aplicará a ${SEL.size} apuntes. Los que estaban divididos en varias categorías quedarán con una sola.</div>`;
  $('#ov').classList.add('on');
}
function selCatApply(){
  const cat = Number($('#sc_cat').value) || null;
  S.transactions.forEach(t => { if (SEL.has(t.id) && t.type !== 'transferencia') { t.category = cat; t.splits = null; touch('tx', t.id); } });
  SEL.clear(); save(); closeForm(); reindex(); render();
}
function selDelete(){
  if (!SEL.size) { alert('Selecciona antes algún apunte'); return; }
  const ids = new Set(SEL);
  S.transactions.forEach(t => { if (ids.has(t.id) && t.pair != null) ids.add(t.pair); });
  ids.forEach(i => gone('tx', i));
  if (!confirm('¿Eliminar ' + SEL.size + ' apuntes? Los reembolsos de gastos eliminados quedarán como ingresos sueltos.')) return;
  S.transactions.forEach(t => { if (t.refundOf != null && ids.has(t.refundOf)) t.refundOf = null; });
  S.transactions = S.transactions.filter(t => !ids.has(t.id));
  SEL.clear(); reindex(); save(); render();
}
function viewMoves(){
  const listHtml = moveList();
  let h = '';
  if (!f.account && !f.q) h += `<div class="bar"><button class="btn" data-mo="-1">‹</button><div class="month">${monthLabel(f.month)}</div><button class="btn" data-mo="1">›</button></div>`;
  const opts = ordered().map(a => `<option value="${a.id}" ${a.id === f.account ? 'selected' : ''}>${esc(a.name)}${a.archived ? ' (archivada)' : ''}</option>`).join('');
  h += `<select id="accsel" class="field">` + `<option value="">Todas las cuentas</option>` + opts + `</select>`;
  h += `<input id="q" class="field" type="search" placeholder="Buscar en todo el histórico (agua, gas…)" value="${esc(f.q)}">`;
  h += `<div id="qsum">${f.q ? qSummary() : ''}</div>`;
  if (selMode) h += selBar();
  h += `<div id="list">${listHtml}</div>`;
  return h;
}
function moveList(){
  let list, runMap = new Map();
  if (f.account) {
    const acc = accMap.get(f.account);
    let run = acc ? acc.opening : 0;
    const asc = S.transactions.filter(t => t.account === f.account).sort(byAsc);
    asc.forEach(t => { if (isFuture(t)) return; run += t.amount; runMap.set(t.id, run); });
    list = asc;
  } else if (f.q) {
    list = S.transactions.slice();
  } else {
    list = S.transactions.filter(t => t.date.slice(0,7) === f.month);
  }
  if (f.q) { const q = nrm(f.q).trim(); list = searchFilter(list, q); }
  list = [...list].sort((a,b) => byAsc(b,a));
  VIS = list.map(t => t.id);
  if (!list.length) return `<div class="empty">Sin movimientos</div>`;
  const groups = [];
  for (const t of list) {
    if (!groups.length || groups[groups.length-1].date !== t.date) groups.push({date: t.date, items: []});
    groups[groups.length-1].items.push(t);
  }
  let h = '';
  for (const g of groups) {
    const sum = g.items.filter(t => !isFuture(t) && t.type !== 'transferencia' && t.type !== 'inversion').reduce((s,t) => s + t.amount, 0);
    h += `<div class="day"><span>${fmtDay(g.date)}</span><span>${money(sum)}</span></div><div class="card">`;
    h += g.items.map(t => rowHtml(t, runMap.get(t.id))).join('');
    h += '</div>';
  }
  return h;
}
function rowHtml(t, run){
  const acc = accMap.get(t.account);
  let title, sub, key, ch;
  if (t.type === 'transferencia') {
    const other = accMap.get(t.transferAccount);
    title = 'Transferencia ' + (t.amount < 0 ? 'a ' : 'desde ') + esc(other ? other.name : '—');
    sub = esc(acc ? acc.name : '');
    key = 'Transferencia'; ch = '⇄';
  } else {
    const cl = t.splits ? [...new Set(t.splits.map(s => catLabel(s.category)))].join(', ') : (t.category ? catLabel(t.category) : 'Sin categoría');
    title = esc(t.payee || (t.splits ? 'Varias categorías' : (t.category ? cl : TYPE_LABEL[t.type])));
    const rs = t.type === 'gasto' ? refundsOf(t.id) : [];
    const refTxt = rs.length ? 'reembolsado ' + money(rs.reduce((s,r) => s + r.amount, 0)) : '';
    const isRef = t.type === 'reembolso' && txMap.has(t.refundOf);
    const same = !t.payee && !t.splits && !isRef && t.category;
    sub = [isRef ? 'Reembolso de ' + exLabel(txMap.get(t.refundOf)) : (same ? '' : cl), f.account ? '' : (acc ? acc.name : ''), refTxt, noteOf(t)].filter(Boolean).map(esc).join(' · ');
    key = (t.category || t.splits) ? cl : TYPE_LABEL[t.type];
    ch = esc((key||'?')[0].toUpperCase());
  }
  const fut = isFuture(t) ? ' style="opacity:.55"' : '';
  const ci = t.type === 'transferencia' ? null : (t.splits ? null : catIconOf(t.category));
  if (ci) ch = ci;
  const chk = selMode ? `<span class="chk ${SEL.has(t.id) ? 'on' : ''}">✓</span>` : '';
  const parts = t.splits ? t.splits.map(s => `<div class="t2" style="display:flex;justify-content:space-between;gap:8px"><span>${esc(catPath(s.category) || 'Sin categoría')}</span><span>${money(s.amount)}</span></div>`).join('') : '';
  return `<div class="row" data-tx="${t.id}"${fut}>${chk}<div class="ic${ci ? ' soft' : ''}" style="${ci ? icStyle(t.category) : 'background:' + colorOf(key)}">${ch}</div><div class="mid"><div class="t1">${title}</div>${t.splits ? parts + (noteOf(t) ? `<div class="t2">${esc(noteOf(t))}</div>` : '') : `<div class="t2">${sub}</div>`}</div><div class="amt ${sign(t.amount)}">${money(t.amount)}${run !== undefined ? `<small>${money(run)}</small>` : ''}${isFuture(t) ? '<small>Futuro · no cuenta</small>' : ''}</div></div>`;
}

/* ---------- Informes ---------- */
let R = {q: '', mode: 'mes', from: null, to: null, excl: new Set(), cats: new Set(), tipo: 'todos', view: 'fechas'};
function pgRange(){
  const cur = curMonth();
  const monthRange = ym => { const [y,m] = ym.split('-').map(Number); return [ym + '-01', ym + '-' + pad(new Date(y, m, 0).getDate())]; };
  switch (R.mode) {
    case 'mes': return monthRange(f.month);
    case 'mes-pasado': return monthRange(shiftMonth(cur, -1));
    case 'trimestre': return [shiftMonth(cur, -2) + '-01', monthRange(cur)[1]];
    case 'anio': { const y = cur.slice(0,4); return [y + '-01-01', y + '-12-31']; }
    case 'anio-pasado': { const y = String(Number(cur.slice(0,4)) - 1); return [y + '-01-01', y + '-12-31']; }
    case 'todo': return ['0000-01-01', '9999-12-31'];
    default: return [R.from || monthRange(cur)[0], R.to || todayStr()];
  }
}
function periodText(){ const [from,to] = pgRange(); return R.mode === 'todo' ? 'Todo el histórico' : fmtDate(from) + ' a ' + fmtDate(to); }
function isLinkedRef(t){ return t.type === 'reembolso' && txMap.has(t.refundOf); }
function describe(t){
  if (isLinkedRef(t)) return 'Reembolso de ' + exLabel(txMap.get(t.refundOf));
  return t.payee || (t.splits ? 'Varias categorías' : (t.category ? catPath(t.category) : TYPE_LABEL[t.type]));
}
function catText(t){ return t.splits ? [...new Set(t.splits.map(s => catPath(s.category)))].join(', ') : (t.category ? catPath(t.category) : ''); }
function searchFilter(list, q){
  const strong = list.filter(t => matchText(t, q, false));
  return strong.length ? strong : list.filter(t => matchText(t, q, true));
}
function matchText(t, q, notes){
  const acc = accMap.get(t.account);
  const hay = ' ' + nrm([t.payee, notes ? t.note : '', catText(t), acc ? acc.name : ''].join(' ')).replace(/[^a-z0-9]+/g, ' ') + ' ';
  return q.split(/\s+/).map(w => w.replace(/[^a-z0-9]+/g, '')).filter(Boolean).every(w => w.length <= 4 ? hay.includes(' ' + w + ' ') : hay.includes(' ' + w));
}
function reportRows(){
  const [from, to] = pgRange();
  let list = S.transactions.filter(t => t.date >= from && t.date <= to && !isFuture(t) && t.type !== 'transferencia' && t.type !== 'inversion');
  if (R.excl.size) list = list.filter(t => !R.excl.has(t.account));
  if (R.cats.size) list = list.filter(txKeep).map(cutTx);
  if (R.tipo === 'gasto') list = list.filter(t => t.amount < 0 || isLinkedRef(t));
  if (R.tipo === 'ingreso') list = list.filter(t => t.amount > 0 && !isLinkedRef(t));
  const q = nrm(R.q).trim();
  if (q) list = searchFilter(list, q);
  return list.sort((a,b) => byAsc(b,a));
}
function reportRow(t){
  const acc = accMap.get(t.account);
  return `<div class="row" data-tx="${t.id}"><div class="mid"><div class="t1">${esc(describe(t))}</div><div class="t2">${esc(fmtDate(t.date))} · ${esc(acc ? acc.name : '')}${catText(t) && catText(t) !== describe(t) ? ' · ' + esc(catText(t)) : ''}${noteOf(t) ? ' · ' + esc(noteOf(t)) : ''}</div></div><div class="amt ${sign(t.amount)}">${money(t.amount)}</div></div>`;
}
function byDescTx(a,b){ return byAsc(b,a); }
function lineRows(list){
  const out = [];
  for (const t of list) {
    if (isLinkedRef(t)) out.push({tx: t, date: t.date, category: refundCat(t), amount: t.amount, linked: true});
    else if (t.splits && t.splits.length) t.splits.forEach(s => out.push({tx: t, date: t.date, category: s.category, amount: s.amount, part: true}));
    else out.push({tx: t, date: t.date, category: t.category, amount: t.amount});
  }
  return out;
}
function sumOf(arr){ return arr.reduce((s,x) => s + x.amount, 0); }
function incomeList(list){ return list.filter(t => t.amount > 0 && !isLinkedRef(t)).sort(byDescTx); }
function expenseList(list){ return list.filter(t => t.amount < 0 || isLinkedRef(t)).sort(byDescTx); }
function topOf(id){ const c = id != null ? topCat(id) : null; return c ? {id: c.id, name: c.name} : {id: 0, name: 'Sin categoría'}; }
function leafName(id, top){
  if (id == null) return 'Sin categoría';
  if (top && id === top.id) return '(directa)';
  return catPath(id).replace(top.name + ' › ', '');
}
function rrow(t, amountOverride){
  const acc = accMap.get(t.account);
  const cl = t.splits ? '' : catText(t);
  const ci = t.splits ? null : catIconOf(t.category);
  return `<div class="rr" data-tx="${t.id}"><span class="rd">${esc(fmtDate(t.date))}</span>${ci ? `<span class="ri" style="${icStyle(t.category)}">${ci}</span>` : ''}<div class="mid"><div class="t1">${esc(describe(t))}</div><div class="t2">${esc(acc ? acc.name : '')}${cl && cl !== describe(t) ? ' · ' + esc(cl) : ''}${noteOf(t) ? ' · ' + esc(noteOf(t)) : ''}</div></div><div class="amt ${sign(t.amount)}">${money(amountOverride != null ? amountOverride : t.amount)}</div></div>`;
}
function expRowFechas(t){
  if (t.splits && t.splits.length) {
    return `<div class="rr" data-tx="${t.id}"><span class="rd">${esc(fmtDate(t.date))}</span><div class="mid"><div class="t1">${esc(t.payee || 'Varias categorías')}</div>` +
      t.splits.map(s => `<div class="rs"><span>${esc(catPath(s.category) || 'Sin categoría')}</span><span class="${sign(s.amount)}">${money(s.amount)}</span></div>`).join('') +
      `<div class="t2">${esc((accMap.get(t.account) || {}).name || '')}${noteOf(t) ? ' · ' + esc(noteOf(t)) : ''}</div></div><div class="amt ${sign(t.amount)}">${money(t.amount)}</div></div>`;
  }
  return rrow(t);
}
function sectionFechas(title, list, rowFn){
  const tot = sumOf(list.map(t => ({amount: t.amount})));
  return `<div class="sec"><span>${title}</span><span>${money(tot)}</span></div>` + (list.length ? `<div class="card">${list.map(rowFn).join('')}</div>` : `<div class="empty">Sin movimientos</div>`);
}
function treeBlock(title, lines){
  if (!lines.length) return `<div class="sec"><span>${title}</span><span>${money(0)}</span></div><div class="empty">Sin movimientos</div>`;
  const tops = new Map();
  lines.forEach(l => {
    const top = topOf(l.category);
    if (!tops.has(top.id)) tops.set(top.id, {top, total: 0, leaves: new Map()});
    const T = tops.get(top.id); T.total += l.amount;
    const key = l.category == null ? -1 : l.category;
    if (!T.leaves.has(key)) T.leaves.set(key, {name: leafName(l.category, top), total: 0, lines: []});
    const L = T.leaves.get(key); L.total += l.amount; L.lines.push(l);
  });
  const grand = sumOf(lines);
  let h = `<div class="sec"><span>${title}</span><span>${money(grand)}</span></div>`;
  [...tops.values()].sort((a,b) => Math.abs(b.total) - Math.abs(a.total)).forEach(T => {
    h += `<div class="cathead"><span>${esc(T.top.name)}</span><span class="${sign(T.total)}">${money(T.total)}</span></div>`;
    [...T.leaves.values()].sort((a,b) => Math.abs(b.total) - Math.abs(a.total)).forEach(L => {
      h += `<div class="subhead"><span>${esc(L.name)}</span><span class="${sign(L.total)}">${money(L.total)}</span></div><div class="card">`;
      h += L.lines.sort((a,b) => byAsc(b.tx, a.tx)).map(l => rrow(l.tx, l.amount)).join('');
      h += `</div>`;
    });
  });
  return h;
}
function monthKey(d){ return d.slice(0,7); }
function monthLabelShort(ym){ const [y,m] = ym.split('-').map(Number); return MES[m-1].slice(0,3) + ' ' + String(y).slice(2); }
function matrixBlock(title, lines, months){
  if (!lines.length) return `<div class="sec"><span>${title}</span></div><div class="empty">Sin movimientos</div>`;
  const tops = new Map();
  lines.forEach(l => {
    const top = topOf(l.category);
    if (!tops.has(top.id)) tops.set(top.id, {top, months: {}, total: 0, leaves: new Map()});
    const T = tops.get(top.id); const mk = monthKey(l.date);
    T.months[mk] = (T.months[mk] || 0) + l.amount; T.total += l.amount;
    const key = l.category == null ? -1 : l.category;
    if (!T.leaves.has(key)) T.leaves.set(key, {name: leafName(l.category, top), months: {}, total: 0});
    const L = T.leaves.get(key); L.months[mk] = (L.months[mk] || 0) + l.amount; L.total += l.amount;
  });
  const cell = v => `<td class="${sign(v)}">${v ? money(v) : ''}</td>`;
  let h = `<div class="sec"><span>${title}</span></div><div class="mx"><table><thead><tr><th></th>${months.map(m => `<th>${monthLabelShort(m)}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  const colTot = {};
  [...tops.values()].sort((a,b) => Math.abs(b.total) - Math.abs(a.total)).forEach(T => {
    h += `<tr class="tophead"><th>${esc(T.top.name)}</th>${months.map(m => cell(T.months[m] || 0)).join('')}<td class="${sign(T.total)}"><b>${money(T.total)}</b></td></tr>`;
    [...T.leaves.values()].sort((a,b) => Math.abs(b.total) - Math.abs(a.total)).forEach(L => {
      h += `<tr><td class="indent">${esc(L.name)}</td>${months.map(m => cell(L.months[m] || 0)).join('')}<td class="${sign(L.total)}">${money(L.total)}</td></tr>`;
    });
    months.forEach(m => { colTot[m] = (colTot[m] || 0) + (T.months[m] || 0); });
  });
  const grand = lines.reduce((s,l) => s + l.amount, 0);
  h += `<tr class="totalrow"><th>Total</th>${months.map(m => cell(colTot[m] || 0)).join('')}<td class="${sign(grand)}"><b>${money(grand)}</b></td></tr>`;
  return h + `</tbody></table></div>`;
}
function monthsOf(lines){
  const set = [...new Set(lines.map(l => monthKey(l.date)))].sort();

}

    block('Ingresos', incL); block('Gastos', expL);

  }
  if (R.view === 'categorias') {
    const block = (title, lines) => { rows.push([title]); const tops = new Map(); lines.forEach(l => { const top = topOf(l.category); if (!tops.has(top.id)) tops.set(top.id, {name: top.name, total:0, leaves: new Map(), top}); const T = tops.get(top.id); T.total += l.amount; const key = l.category == null ? -1 : l.category; if (!T.leaves.has(key)) T.leaves.set(key, {name: leafName(l.category, T.top), total: 0, lines: []}); const L = T.leaves.get(key); L.total += l.amount; L.lines.push(l); }); tops.forEach(T => { rows.push([T.name, '', '', '', Math.round(T.total*100)/100]); T.leaves.forEach(L => { rows.push(['   ' + L.name, '', '', '', Math.round(L.total*100)/100]); L.lines.forEach(l => { const acc = accMap.get(l.tx.account); rows.push([fmtDate(l.tx.date), describe(l.tx), acc ? acc.name : '', '', Math.round(l.amount*100)/100]); }); }); }); rows.push(['Total ' + title.toLowerCase(), '', '', '', Math.round(sumOf(lines)*100)/100]); rows.push([]); };

function download(blob, name){

function catBlock(title, list, expenseMode){
  if (!list.length) return '';
  const tot = new Map();
  for (const t of list) {
    const top = topCat(t.category);
    const key = top ? top.id : 0;
    const name = top ? top.name : 'Sin categoría';
    const e = tot.get(key) || {name, total: 0, kids: new Map()};
    e.total += t.amount;
    const kn = (t.category && top && t.category !== top.id) ? catPath(t.category).replace(top.name + ' › ', '') : (top ? 'Sin subcategoría' : 'Sin categoría');
    e.kids.set(kn, (e.kids.get(kn) || 0) + t.amount);
    tot.set(key, e);
  }
  let arr = [...tot.values()].sort((a,b) => Math.abs(b.total) - Math.abs(a.total));
  if (expenseMode) arr = arr.filter(e => e.total < 0);
  if (!arr.length) return '';
  const max = Math.abs(arr[0].total) || 1;
  const all = Math.abs(list.reduce((s,t) => s + t.amount, 0)) || 1;
  let h = `<div class="sec"><span>${title}</span></div><div class="card">`;
  for (const e of arr) {
    const kids = [...e.kids.entries()].sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
    h += `<details><summary class="row"><div class="ic" style="background:${colorOf(e.name)}">${esc((e.name||'?')[0].toUpperCase())}</div><div class="mid"><div class="t1">${esc(e.name)}</div><div class="bar2"><i style="width:${Math.round(Math.abs(e.total)/max*100)}%"></i></div></div><div class="amt">${money(e.total)}<small>${Math.round(Math.abs(e.total)/all*100)}%</small></div></summary>`;
    h += kids.map(([n,v]) => `<div class="sub"><div><span>${esc(n)}</span><span>${money(v)}</span></div></div>`).join('');
    h += '</details>';
  }
  return h + '</div>';
}

    const sumAbs = FSPL.reduce((s,l) => s + Math.abs(l.amount || 0), 0);
    if (Math.abs(sumAbs - amt) > 0.005) { alert('Las líneas suman ' + money(sumAbs) + ' y el total es ' + money(amt)); return; }
    splits = FSPL.map(l => ({category: l.category || null, amount: Math.round(sg * Math.abs(l.amount) * 100) / 100}));
  }
  const orig = FID != null ? S.transactions.find(t => t.id === FID) : null;
  const note = $('#f_note').value.trim();
  const cat = Number($('#f_cat').value) || null;
  const pay = $('#f_pay').value.trim() || null;
  let refId = null;
  if (FK === 'reembolso') {
    refId = refIdFromLabel($('#f_ref').value);
    const ex = refId != null ? txMap.get(refId) : null;
    if (!ex || ex.type !== 'gasto') { alert('Elige el gasto al que corresponde el reembolso de la lista'); return; }
    const already = refundsOf(refId).filter(r => !orig || r.id !== orig.id).reduce((s,r) => s + r.amount, 0);
    if (already + amt > Math.abs(ex.amount) + 0.005 && !confirm('Los reembolsos de ese gasto superarían su importe. ¿Guardar igualmente?')) return;
  }
  if (FK === 'gasto' && orig && orig.type === 'gasto') {
    const sumRef = refundsOf(orig.id).reduce((s,r) => s + r.amount, 0);
    if (sumRef > amt + 0.005 && !confirm('Este gasto ya tiene reembolsos por ' + money(sumRef) + ', más que el nuevo importe. ¿Guardar igualmente?')) return;
  }
  const keepId = orig && !tr && orig.type !== 'transferencia' ? orig.id : null;
  removeOriginal();
  let nid = keepId != null ? keepId : S.transactions.reduce((m,t) => Math.max(m, t.id), 0) + 1;
  touch('tx', nid); if (tr) touch('tx', nid + 1);
  if (tr) {
    S.transactions.push({id:nid, date, amount:-amt, account:acc, type:'transferencia', category:null, payee:null, note, transferAccount:to, pair:nid+1, reconciled:true});
    S.transactions.push({id:nid+1, date, amount:amt, account:to, type:'transferencia', category:null, payee:null, note, transferAccount:acc, pair:nid, reconciled:true});
  } else {
    if (FK === 'reembolso') {
      S.transactions.push({id:nid, date, amount: amt, account:acc, type:'reembolso', category:null, splits:null, payee:null, note, transferAccount:null, pair:null, reconciled:true, refundOf: refId});
    } else {
      const type = FK === 'ingreso' ? ((orig && orig.type === 'reembolso') ? 'reembolso' : 'ingreso') : 'gasto';
      S.transactions.push({id:nid, date, amount: sg * amt, account:acc, type, category: splits ? null : cat, splits, payee:pay, note, transferAccount:null, pair:null, reconciled:true});
    }
  }
  reindex(); save(); closeForm(); render();
}
function deleteTx(){
  if (FID == null) return;
  const n = refundsOf(FID).length;
  if (!confirm('¿Eliminar este movimiento?' + (n ? ' Sus ' + n + ' reembolsos quedarán como ingresos sueltos.' : ''))) return;
  S.transactions.forEach(t => { if (t.refundOf === FID) t.refundOf = null; });
  removeOriginal(); reindex(); save(); closeForm(); render();
}

async function fetchPrice(sym){
  const ctrl = new AbortController();
  const tm = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/' + encodeURIComponent(sym) + '?interval=1d&range=1d', {signal: ctrl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const m = j.chart.result[0].meta;
    if (!(m.regularMarketPrice > 0)) throw new Error('sin precio');
    return {price: m.regularMarketPrice, date: dayOf(new Date(m.regularMarketTime * 1000)), prev: m.chartPreviousClose || m.previousClose || null};
  } finally { clearTimeout(tm); }
}
async function updatePrices(){
  const hs = S.holdings || [];
  if (!hs.length) return;
  pmsg = 'Actualizando precios…';
  render();
  let ok = 0, fail = 0;
  for (const h of hs) {
    try { const p = await fetchPrice(h.symbol); h.price = p.price; h.priceDate = p.date; if (p.prev) h.prevClose = p.prev; ok++; }
    catch (e) { fail++; }
  }
  if (ok) save();
  pmsg = fail === 0 ? 'Precios actualizados desde la web.'
       : ok ? 'Algunos precios se han actualizado desde la web.'
       : 'No se han podido consultar los precios desde la web. Se usa el último guardado; toca un valor para cambiarlo.';
  render();
}

/* ---------- Registro de cambios del usuario (para fusionar sin pisarlos) ---------- */
function touch(coll, id){
  S.touched = S.touched || {}; S.touched[coll] = S.touched[coll] || {}; S.touched[coll][id] = Date.now();
  if (S.deleted && S.deleted[coll]) delete S.deleted[coll][id];
}
function gone(coll, id){ S.deleted = S.deleted || {}; S.deleted[coll] = S.deleted[coll] || {}; S.deleted[coll][id] = 1; }
function canon(v){
  if (v === undefined) return 'null';
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}
/* Fusiona datos externos en los de este dispositivo: añade lo que falta, actualiza lo que no has cambiado
   aquí, conserva tus cambios y aplica los borrados hechos en otro dispositivo (salvo que los hayas editado aquí). */
function mergeData(inc){
  const tc = S.touched || {}, st = {add: 0, upd: 0, keep: 0, del: 0};
  S.deleted = S.deleted || {};
  const applyDeletes = (key, local) => {
    const rem = (inc.deleted && inc.deleted[key]) || {};
    S.deleted[key] = S.deleted[key] || {};
    let out = local;
    for (const k of Object.keys(rem)) {
      const id = Number(k);
      if (tc[key] && tc[key][id]) continue;
      S.deleted[key][id] = 1;
      const before = out.length; out = out.filter(x => x.id !== id); st.del += before - out.length;
    }
    return out;
  };
  const mergeColl = (key, local, incoming) => {
    const idx = new Map(local.map((x, i) => [x.id, i]));
    const out = local.slice();
    for (const r of incoming) {
      if (!idx.has(r.id)) { if (S.deleted[key] && S.deleted[key][r.id]) continue; out.push(JSON.parse(JSON.stringify(r))); st.add++; continue; }
      const i = idx.get(r.id);
      if (tc[key] && tc[key][r.id]) { st.keep++; continue; }
      if (canon(out[i]) !== canon(r)) { out[i] = JSON.parse(JSON.stringify(r)); st.upd++; }
    }
    return out;
  };
  S.accounts = mergeColl('acc', applyDeletes('acc', S.accounts), inc.accounts || []);
  S.categories = mergeColl('cat', applyDeletes('cat', S.categories), inc.categories || []);
  S.transactions = mergeColl('tx', applyDeletes('tx', S.transactions), inc.transactions || []);
  S.reports = mergeColl('rep', applyDeletes('rep', S.reports || []), inc.reports || []);
  S.holdings = S.holdings || [];
  const hid = new Set(S.holdings.map(h => h.id));
  (inc.holdings || []).forEach(h => { if (!hid.has(h.id)) S.holdings.push(JSON.parse(JSON.stringify(h))); });
  const ord = new Set(S.accountOrder || []);
  S.accountOrder = [...(S.accountOrder || []), ...(inc.accountOrder || []).filter(id => !ord.has(id))];
  reindex();
  return st;
}
function mergeImport(inc){
  if (!valid(inc)) { alert('El archivo no es una copia válida de esta app.'); return; }
  if (!confirm('Se añadirán los movimientos, cuentas y categorías que falten, y se actualizarán los que no hayas cambiado en este dispositivo. Lo que hayas cambiado aquí se mantiene. Antes se guarda una copia. ¿Continuar?')) return;
  try { localStorage.setItem(KEY + '-antes-fusion', JSON.stringify(S)); } catch (e) {}
  const st = mergeData(inc); save(); closeForm(); render();
  alert(`Fusión lista: ${st.add} añadidos, ${st.upd} actualizados, ${st.keep} cambios tuyos conservados${st.del ? ', ' + st.del + ' eliminados' : ''}.`);
}

/* ---------- Estado de informes y filtro por categorías ---------- */
function persistRep(){ S.repState = {excl: [...R.excl], cats: [...R.cats]}; save(); }
function catKeep(id){
  if (id == null) return false;
  let c = id, g = 0;
  while (c != null && g++ < 10) { if (R.cats.has(c)) return true; const x = catMap.get(c); c = x && x.parent != null ? x.parent : null; }
  return false;
}
function txKeep(t){
  const ids = t.splits ? t.splits.map(s => s.category) : [(t.type === 'reembolso' && txMap.has(t.refundOf)) ? refundCat(t) : t.category];
  return ids.some(catKeep);
}
function cutTx(t){
  if (!t.splits) return t;
  const kept = t.splits.filter(s => catKeep(s.category));
  return {...t, splits: kept, amount: kept.reduce((s, x) => s + x.amount, 0)};
}
function catPickList(){
  const cats = [...S.categories].sort((a, b) => catPath(a.id).localeCompare(catPath(b.id), 'es'));
  return `<div class="bar" style="justify-content:space-between;align-items:center"><button class="btn" data-act="catall">Todas</button><span class="t2">${R.cats.size ? R.cats.size + ' elegidas' : 'Sin filtro: todas'}</span><span></span></div>` +
    `<div class="t2" style="margin:0 16px 8px">Al elegir una categoría principal se incluyen también sus subcategorías.</div><div class="card" style="margin:0 12px 24px">` +
    cats.map(c => `<div class="row" data-rc="${c.id}" style="min-height:44px"><span class="chk ${R.cats.has(c.id) ? 'on' : ''}">✓</span><div class="mid"><div class="t1">${esc(catPath(c.id))}</div></div></div>`).join('') + `</div>`;
}
function catPickOpen(){
  $('#sheet').innerHTML = `<div class="hd"><button class="btn" data-act="cancel">Cerrar</button><strong>Categorías en el informe</strong><button class="btn primary" data-act="accdone">Listo</button></div><div id="repcat">${catPickList()}</div>`;
  $('#ov').classList.add('on');
}
function catRefresh(){ persistRep(); const el = $('#repcat'); if (el) el.innerHTML = catPickList(); render(); }
function toggleRepCat(id){ if (R.cats.has(id)) R.cats.delete(id); else R.cats.add(id); catRefresh(); }
function saveReportAs(){
  const name = prompt('Nombre del informe (p. ej. Coche, Facturas, Gastos fijos)', '');
  if (!name || !name.trim()) return;
  const id = Date.now();
  S.reports = S.reports || [];
  S.reports.push({id, name: name.trim(), mode: R.mode, from: R.from, to: R.to, month: f.month, q: R.q, tipo: R.tipo, view: R.view, excl: [...R.excl], cats: [...R.cats]});
  touch('rep', id); save(); render();
  alert('Informe guardado: ' + name.trim());
}
function applyReport(id){
  const r = (S.reports || []).find(x => x.id === id); if (!r) return;
  R.mode = r.mode; R.from = r.from; R.to = r.to; if (r.month) f.month = r.month;
  R.q = r.q || ''; R.tipo = r.tipo || 'todos'; R.view = r.view || 'fechas';
  R.excl = new Set(r.excl || []); R.cats = new Set(r.cats || []);
  persistRep(); closeForm(); render();
}
function deleteReport(id){
  if (!confirm('¿Borrar este informe guardado?')) return;
  S.reports = (S.reports || []).filter(r => r.id !== id); gone('rep', id);
  save(); openSavedReports(); render();
}
function openSavedReports(){
  const MODE = {mes:'Mes elegido', 'mes-pasado':'Mes pasado', trimestre:'Últimos 3 meses', anio:'Este año', 'anio-pasado':'Año pasado', todo:'Todo el histórico', rango:'Entre fechas'};
  const list = S.reports || [];
  $('#sheet').innerHTML = `<div class="hd"><button class="btn" data-act="cancel">Cerrar</button><strong>Informes guardados</strong><span></span></div>` +
    (list.length ? `<div class="card" style="margin:12px">` + list.map(r => `<div class="row" data-rep="${r.id}"><div class="mid"><div class="t1">${esc(r.name)}</div><div class="t2">${esc(MODE[r.mode] || r.mode)}${r.cats && r.cats.length ? ' · ' + r.cats.length + ' categorías' : ''}${r.excl && r.excl.length ? ' · ' + (S.accounts.length - r.excl.length) + ' cuentas' : ''}</div></div><button class="btn danger" data-repdel="${r.id}">Borrar</button></div>`).join('') + `</div>`
      : `<div class="empty">Aún no hay informes guardados. Ajusta un informe y pulsa «Guardar informe».</div>`);
  $('#ov').classList.add('on');
}

/* ---------- Sincronización con Supabase ---------- */
let SYNC_ON = false, SYNCING = false, SYNC_TIMER = null, SYNC_MSG = '', SYNC_EMAIL = '', SYNC_SENT = false, SYNCCLI = null;
function sbConf(){ try { return JSON.parse(localStorage.getItem('mw-sb') || 'null'); } catch (e) { return null; } }
function sbClient(){
  const c = sbConf();
  if (!c || !c.url || !c.key || !window.supabase) return null;
  if (!SYNCCLI || SYNCCLI.url !== c.url || SYNCCLI.key !== c.key)
    SYNCCLI = {url: c.url, key: c.key, cli: window.supabase.createClient(c.url, c.key, {auth: {persistSession: true, autoRefreshToken: true}})};
  return SYNCCLI.cli;
}
function pushPayload(){ return JSON.parse(JSON.stringify({...S, touched: undefined, repState: undefined})); }
function clearTouchedBefore(ts){
  const t = S.touched || {};
  Object.keys(t).forEach(coll => Object.keys(t[coll]).forEach(id => { if (t[coll][id] <= ts) delete t[coll][id]; }));
}
function scheduleSync(){ if (!SYNC_ON || SYNCING) return; clearTimeout(SYNC_TIMER); SYNC_TIMER = setTimeout(syncNow, 3000); }
async function syncNow(){
  if (SYNCING) return;
  const c = sbClient();
  if (!c) { SYNC_MSG = 'Falta guardar la conexión con Supabase.'; render(); return; }
  const {data: sd} = await c.auth.getSession();
  const session = sd && sd.session;
  if (!session) { SYNC_ON = false; SYNC_MSG = 'Inicia sesión para sincronizar.'; render(); return; }
  SYNC_ON = true; SYNCING = true; SYNC_MSG = 'Sincronizando…';
  try {
    const uid = session.user.id;
    const got = await c.from('finanzas').select('data').eq('user_id', uid).maybeSingle();
    if (got.error) throw got.error;
    if (got.data && got.data.data) { mergeData(got.data.data); save(); }
    const started = Date.now();
    const put = await c.from('finanzas').upsert({user_id: uid, data: pushPayload(), updated_at: new Date().toISOString()});
    if (put.error) throw put.error;
    clearTouchedBefore(started);
    save();
    SYNC_MSG = 'Sincronizado a las ' + new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'});
  } catch (err) {
    SYNC_MSG = 'No se pudo sincronizar: ' + (err && err.message ? err.message : err);
  } finally { SYNCING = false; }
  render();
}
async function syncBoot(){
  const c = sbClient();
  if (!c) return;
  try {
    const {data} = await c.auth.getSession();
    if (data && data.session) { SYNC_ON = true; syncNow(); }
  } catch (e) {}
  document.addEventListener('visibilitychange', () => { if (!document.hidden && SYNC_ON) syncNow(); });
}
async function syncSendCode(){
  const c = sbClient();
  if (!c) { SYNC_MSG = 'Guarda primero la conexión.'; render(); return; }
  const el = $('#sy_email'); const email = el ? el.value.trim() : '';
  if (!email) { SYNC_MSG = 'Escribe tu correo.'; render(); return; }
  const {error} = await c.auth.signInWithOtp({email, options: {shouldCreateUser: true}});
  SYNC_EMAIL = email; SYNC_SENT = !error;
  SYNC_MSG = error ? 'No se pudo enviar el código: ' + error.message : 'Te hemos enviado un código a ' + email + '. Escríbelo abajo.';
  render();
}
async function syncVerify(){
  const c = sbClient();
  const el = $('#sy_code'); const code = el ? el.value.trim() : '';
  const {error} = await c.auth.verifyOtp({email: SYNC_EMAIL, token: code, type: 'email'});
  if (error) { SYNC_MSG = 'Código no válido: ' + error.message; render(); return; }
  SYNC_SENT = false; SYNC_ON = true; SYNC_MSG = 'Sesión iniciada.';
  render(); syncNow();
}
async function syncOut(){
  const c = sbClient();
  if (c) await c.auth.signOut();
  SYNC_ON = false; SYNC_SENT = false;
  SYNC_MSG = 'Sesión cerrada. Los datos siguen guardados en este dispositivo.';
  render();
}
function syncSaveConn(){
  const url = $('#sy_url').value.trim().replace(/\/$/, ''), key = $('#sy_key').value.trim();
  if (!url || !key) { alert('Pon la URL y la clave'); return; }
  localStorage.setItem('mw-sb', JSON.stringify({url, key}));
  SYNCCLI = null; SYNC_MSG = 'Conexión guardada. Ahora entra con tu correo.'; render();
}
function syncReconn(){ localStorage.removeItem('mw-sb'); SYNCCLI = null; SYNC_ON = false; SYNC_SENT = false; SYNC_MSG = ''; render(); }
function syncBlock(){
  const conf = sbConf();
  const has = !!(conf && conf.url && conf.key);
  let body;
  if (!has) body = `<div class="fr"><label>URL</label><input id="sy_url" placeholder="https://xxxx.supabase.co" value="${esc(conf ? conf.url || '' : '')}" style="text-align:left"></div><div class="fr"><label>Clave</label><input id="sy_key" placeholder="clave anon / publishable" style="text-align:left"></div><div class="fr" style="justify-content:center"><button class="btn primary" data-act="sync-conn">Guardar conexión</button></div>`;
  else if (!SYNC_ON) body = SYNC_SENT
    ? `<div class="fr"><label>Código</label><input id="sy_code" inputmode="numeric" placeholder="123456" style="text-align:left"></div><div class="fr" style="justify-content:center"><button class="btn primary" data-act="sync-verify">Entrar</button></div>`
    : `<div class="fr"><label>Correo</label><input id="sy_email" type="email" value="${esc(SYNC_EMAIL)}" placeholder="tu@correo.com" style="text-align:left"></div><div class="fr" style="justify-content:center"><button class="btn primary" data-act="sync-send">Enviar código</button></div>`;
  else body = `<div class="fr" style="justify-content:center"><button class="btn primary" data-act="sync-now">Sincronizar ahora</button></div><div class="fr" style="justify-content:center"><button class="btn danger" data-act="sync-out">Cerrar sesión</button></div>`;
  body += `<div class="fr" style="justify-content:center"><button class="btn" data-act="sync-reconn">Cambiar conexión</button></div>`;
  return `<div class="sec"><span>Sincronización</span></div><div class="fld">${body}</div>` + (SYNC_MSG ? `<div class="empty">${esc(SYNC_MSG)}</div>` : '');
}

/* ---------- Fusionar categorías ---------- */
function catMergeBlock(c){
  if (S.categories.some(x => x.parent === c.id)) return '';
  const opts = S.categories.filter(x => x.id !== c.id && !isDescOf(x.id, c.id)).sort((a, b) => catPath(a.id).localeCompare(catPath(b.id), 'es'))
    .map(x => `<option value="${x.id}">${esc(catPath(x.id))}</option>`).join('');
  return `<div class="fld"><div class="fr"><label>Fusionar en</label><select id="c_into" style="text-align:left">${opts}</select></div><div class="fr" style="justify-content:center"><button class="btn primary" data-act="catmerge">Fusionar en esa categoría</button></div></div><div class="empty">Sus movimientos pasan a la categoría elegida y esta desaparece.</div>`;
}
function mergeCatTo(from, to){
  if (from == null || to == null || from === to) return false;
  S.transactions.forEach(t => {
    if (t.category === from) { t.category = to; touch('tx', t.id); }
    (t.splits || []).forEach(s => { if (s.category === from) { s.category = to; touch('tx', t.id); } });
  });
  gone('cat', from);
  S.categories = S.categories.filter(x => x.id !== from);
  reindex(); save();
  return true;
}
function mergeCatNow(){
  const from = FCAT, to = Number(($('#c_into') || {}).value) || null;
  if (from == null || to == null || from === to) { alert('Elige otra categoría a la que fusionar'); return; }
  if (!confirm(`¿Fusionar «${catLabel(from)}» en «${catLabel(to)}»? Sus movimientos pasan a la otra categoría y esta se elimina.`)) return;
  mergeCatTo(from, to); closeForm(); render();
}

/* ---------- Ajustes: exportar, importar, restaurar ---------- */
function stampNow(){ const n = new Date(); return n.getFullYear() + pad(n.getMonth()+1) + pad(n.getDate()) + pad(n.getHours()) + pad(n.getMinutes()); }
function exportData(){
  // La copia incluye como borrados todo lo que el dispositivo ya no tiene del backup base,
  // así un dispositivo nuevo no vuelve a traer lo que se eliminó antes de esta versión.
  const out = JSON.parse(JSON.stringify(S));
  out.deleted = out.deleted || {};
  [['acc','accounts'], ['cat','categories'], ['tx','transactions']].forEach(([k, key]) => {
    out.deleted[k] = out.deleted[k] || {};
    const have = new Set(S[key].map(x => x.id));
    (SEED[key] || []).forEach(x => { if (!have.has(x.id)) out.deleted[k][x.id] = 1; });
  });
  const blob = new Blob([JSON.stringify(out)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mis-finanzas-' + stampNow() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}
function restoreSeed(){ mergeImport(JSON.parse(JSON.stringify(SEED))); }
$('#fileIn').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let obj = null;
    try { obj = JSON.parse(r.result); } catch(err) {}
    if (!valid(obj)) { alert('El archivo no es una copia válida de esta app.'); }
    else mergeImport(obj);
    e.target.value = '';
  };
  r.readAsText(file);
});

/* ---------- Navegación y render ---------- */
function go(v, acc){
  view = v; if (v !== 'cuentas') reorder = false;
  if (v !== 'movimientos') { selMode = false; SEL.clear(); }
  if (v === 'movimientos') f.account = (acc === undefined ? null : acc);
  render();
  window.scrollTo(0,0);
}
function act(a){
  if (a === 'new') openForm(null);
  else if (a === 'back') go('cuentas');
  else if (a === 'cancel') closeForm();
  else if (a === 'save') saveForm();
  else if (a === 'del') deleteTx();
  else if (a === 'export') exportData();
  else if (a === 'import') $('#fileIn').click();
  else if (a === 'restore') restoreSeed();
  else if (a === 'prices') updatePrices();
  else if (a === 'reorder') { reorder = !reorder; render(); }
  else if (a === 'accnew') openAccForm(null);
  else if (a === 'accedit') openAccForm(f.account);
  else if (a === 'accsave') saveAcc();
  else if (a === 'catnew') openCatForm(null);
  else if (a === 'catsave') saveCat();
  else if (a === 'catdel') deleteCat();
  else if (a === 'splitopen') splitOpen();
  else if (a === 'splitclose') splitClose();
  else if (a === 'settings') go('ajustes');
  else if (a === 'catsettings') go('categorias');
  else if (a === 'selmode') { selMode = !selMode; if (!selMode) SEL.clear(); render(); }
  else if (a === 'selall') { VIS.forEach(id => SEL.add(id)); render(); }
  else if (a === 'selnone') { SEL.clear(); render(); }
  else if (a === 'selcat') selCatOpen();
  else if (a === 'selcatapply') selCatApply();
  else if (a === 'seldel') selDelete();
  else if (a === 'pdf') window.print();
  else if (a === 'xls') exportXls();
  else if (a === 'toreport') { R.q = f.q; R.mode = 'todo'; go('informes'); }
  else if (a === 'restorebak') restoreBackup();
  else if (a === 'accpick') repAccOpen();
  else if (a === 'catmerge') mergeCatNow();
  else if (a === 'sync-conn') syncSaveConn();
  else if (a === 'sync-send') syncSendCode();
  else if (a === 'sync-verify') syncVerify();
  else if (a === 'sync-now') syncNow();
  else if (a === 'sync-out') syncOut();
  else if (a === 'sync-reconn') syncReconn();
  else if (a === 'catpick') catPickOpen();
  else if (a === 'catall') { R.cats.clear(); catRefresh(); }
  else if (a === 'repsave') saveReportAs();
  else if (a === 'repsaved') openSavedReports();
  else if (a === 'accall') { R.excl.clear(); repAccRefresh(); }
  else if (a === 'accnone') { R.excl = new Set(S.accounts.map(a => a.id)); repAccRefresh(); }
  else if (a === 'accdone') { closeForm(); render(); }
  else if (a === 'dismiss') { MIGRATED = false; render(); }
}
function render(){
  $('#tabs').innerHTML = TABS.map(([k,g,l]) => `<button class="${(view === k || (k === 'ajustes' && view === 'categorias')) ? 'on' : ''}" data-tab="${k}"><span class="g">${g}</span>${l}</button>`).join('');
  const titles = {cuentas:'Cuentas', movimientos:'Movimientos', informes:'Pérdidas y ganancias', ajustes:'Ajustes', categorias:'Categorías'};
  let title = titles[view];
  if (view === 'movimientos' && f.account && accMap.get(f.account)) title = accMap.get(f.account).name;
  $('#title').textContent = title;
  let hact = '';
  if (view === 'movimientos') {
    if (f.account) hact += `<button class="btn" data-act="back">‹ Cuentas</button><button class="btn" data-act="accedit">Editar</button>`;
    hact += `<button class="btn" data-act="selmode">${selMode ? 'Listo' : 'Seleccionar'}</button><button class="btn primary" data-act="new">+ Nuevo</button>`;
  } else if (view === 'cuentas') {
    hact = `<button class="btn" data-act="reorder">${reorder ? 'Listo' : 'Ordenar'}</button><button class="btn primary" data-act="accnew">+ Cuenta</button>`;
  } else if (view === 'categorias') {
    hact = `<button class="btn" data-act="settings">‹ Ajustes</button><button class="btn primary" data-act="catnew">+ Categoría</button>`;
  }
  $('#hact').innerHTML = hact;
  const banner = (MIGRATED ? `<div class="banner">Datos actualizados a la versión corregida. Tu copia anterior queda guardada en Ajustes. <button class="btn" data-act="dismiss">Entendido</button></div>` : '') + (storeOK ? '' : `<div class="banner">Este navegador no permite guardar datos aquí. Antes de cerrar, exporta una copia desde Ajustes.</div>`);
  const body = view === 'cuentas' ? viewAccounts() : view === 'movimientos' ? viewMoves() : view === 'informes' ? viewReports() : view === 'categorias' ? viewCategories() : viewSettings();
  $('#main').innerHTML = banner + body;
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'ov') { closeForm(); return; }
  const rp = t.closest('[data-repdel]'); if (rp) { deleteReport(Number(rp.dataset.repdel)); return; }
  const rq = t.closest('[data-rep]'); if (rq) { applyReport(Number(rq.dataset.rep)); return; }
  const rc = t.closest('[data-rc]'); if (rc) { toggleRepCat(Number(rc.dataset.rc)); return; }
  const k = t.closest('#kind button'); if (k) { FK = k.dataset.k; formUI(); return; }
  const tab = t.closest('[data-tab]'); if (tab) { go(tab.dataset.tab); return; }
  const mo = t.closest('[data-mo]'); if (mo) { f.month = shiftMonth(f.month, Number(mo.dataset.mo)); render(); return; }
  const ac = t.closest('[data-act]'); if (ac) { act(ac.dataset.act); return; }
  const gl = t.closest('[data-go]'); if (gl) { go(gl.dataset.go, Number(gl.dataset.acc)); return; }
  const mvb = t.closest('[data-move]'); if (mvb) { moveAcc(Number(mvb.dataset.acc), Number(mvb.dataset.move)); return; }
  const hp = t.closest('[data-hprice]'); if (hp) { editPrice(Number(hp.dataset.hprice)); return; }
  const sadd = t.closest('[data-sadd]'); if (sadd) { FSPL.push({category: null, amount: 0}); splitUI(); return; }
  const sdel = t.closest('[data-sdel]'); if (sdel) { FSPL.splice(Number(sdel.dataset.sdel), 1); if (!FSPL.length) FSPL = null; formUI(); return; }
  const ic = t.closest('[data-icon]'); if (ic) { FICON = ic.dataset.icon || null; $('#iconpick').innerHTML = iconPickHtml(); return; }
  const ct = t.closest('[data-cat]'); if (ct) { openCatForm(Number(ct.dataset.cat)); return; }
  const ra = t.closest('[data-ra]'); if (ra) { toggleRepAcc(Number(ra.dataset.ra)); return; }
  const tx = t.closest('[data-tx]');
  if (tx && selMode) { const id = Number(tx.dataset.tx); if (SEL.has(id)) SEL.delete(id); else SEL.add(id); render(); return; }
  if (tx) { openForm(Number(tx.dataset.tx)); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { f.q = e.target.value; $('#list').innerHTML = moveList(); $('#qsum').innerHTML = f.q ? qSummary() : ''; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'accsel') { f.account = el.value ? Number(el.value) : null; render(); return; }
  if (el.id === 'rsel') { R.mode = el.value; if (R.mode === 'rango') { const r = pgRange(); R.from = r[0]; R.to = r[1]; } render(); return; }
  if (el.id === 'rfrom' || el.id === 'rto') { R[el.id === 'rfrom' ? 'from' : 'to'] = el.value; render(); return; }
  if (el.id === 'rq') { R.q = el.value; render(); return; }
  if (el.id === 'rtipo') { R.tipo = el.value; render(); return; }
  if (el.id === 'rview') { R.view = el.value; render(); return; }
  if (el.dataset && el.dataset.sc != null && FSPL) { FSPL[Number(el.dataset.sc)].category = Number(el.value) || null; splitUI(); return; }
  if (el.dataset && el.dataset.sa != null && FSPL) { const sg = FK === 'gasto' ? -1 : 1; FSPL[Number(el.dataset.sa)].amount = sg * Math.abs(parseFloat(el.value) || 0); splitUI(); return; }
  if (el.id === 'f_amt' && FSPL) splitUI();
});

S = loadState(); repairRefunds();
if (S.repState) { R.excl = new Set(S.repState.excl || []); R.cats = new Set(S.repState.cats || []); }
reindex();
save();
render();
if ((S.holdings || []).length) updatePrices();
</script>
