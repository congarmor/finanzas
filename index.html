<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mis finanzas</title>
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#0b3a8f">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#8e8e93;--sep:#d8d8de;--accent:#0a7cff;--neg:#d70015;--pos:#248a3d;--nav:rgba(255,255,255,.94);--head:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#8e8e93;--sep:#38383a;--accent:#0a84ff;--neg:#ff453a;--pos:#30d158;--nav:rgba(28,28,30,.94);--head:#1c1c1e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--head);border-bottom:1px solid var(--sep);padding:10px 14px;display:flex;align-items:center;gap:8px;min-height:52px}
header.top h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{background:none;border:0;color:var(--accent);font:inherit;padding:8px;cursor:pointer;border-radius:8px}
.btn.primary{background:var(--accent);color:#fff;border-radius:20px;padding:6px 14px;font-weight:600}
.btn.danger{color:var(--neg)}
.calw{position:relative;display:inline-flex;flex:none}.calw input{position:absolute;left:0;bottom:0;width:100%;height:100%;opacity:0;pointer-events:none;border:0}
.btn.xclr{color:var(--neg);padding:6px 9px;font-weight:700;flex:none}.btn.xclr:disabled{opacity:.25;cursor:default}
main{max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--sep);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:12px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
nav.tabs button .g{font-size:26px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700;border-top-color:var(--accent);background:rgba(10,124,255,.08)}
.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;padding:18px 16px 6px;display:flex;justify-content:space-between;gap:8px}
.card{background:var(--card);margin:0 12px;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--sep);cursor:pointer;min-height:56px;list-style:none}
.row:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;font-size:15px}
.mid{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price-date{font-size:12px;color:var(--muted);white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3;margin-top:2px}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt small{display:block;font-size:12px;color:var(--muted)}
.neg{color:var(--neg)}
.pos{color:var(--pos)}
.hero{margin:12px;padding:18px;border-radius:14px;background:linear-gradient(135deg,#0a7cff,#5e5ce6);color:#fff}
.hero .l{font-size:14px;opacity:.85}
.hero .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px}
.month{display:flex;align-items:center;justify-content:center;font-weight:600;flex:1;text-transform:capitalize}
.field{width:100%;margin:6px 12px;padding:9px 12px;border-radius:10px;border:0;background:var(--card);color:var(--text);font:inherit;outline:none}
.search-wrap{display:flex;align-items:center;gap:4px;margin:6px 12px;background:var(--card);border-radius:10px;padding-right:5px}.search-wrap .field{flex:1;min-width:0;width:100%;margin:0}.search-clear{border:0;background:transparent;color:var(--muted);font-size:23px;line-height:1;padding:5px 9px;cursor:pointer;border-radius:50%;flex:none}.search-clear:active{background:var(--bg)}
.qfield{flex:none;max-width:42%;border:0;border-right:1px solid var(--bg);background:transparent;color:var(--accent);font:inherit;font-size:14px;padding:10px 4px 10px 12px;border-radius:10px 0 0 10px}.search-options{margin:0 12px 8px}.search-options>summary{color:var(--accent);font-size:14px;padding:5px 2px}.search-options .filters{background:var(--card);border-radius:10px;padding:6px 10px}.filter-toggle{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:14px}.filter-toggle input{width:17px;height:17px;accent-color:var(--accent)}.filter-row{display:flex;align-items:center;gap:4px;margin:4px 0 8px}.filter-row .field{margin:0;flex:1;min-width:0}.filter-row .search-clear{font-size:21px}.money-wrap{display:flex;align-items:center;flex:1;min-width:0}.money-wrap input{width:100%;min-width:0}.money-wrap .currency{color:var(--muted);padding-left:8px;font-weight:600}
.day{display:flex;justify-content:space-between;padding:14px 16px 6px;font-size:13px;color:var(--muted);text-transform:none}
.banner{margin:10px 12px;padding:10px 12px;border-radius:10px;background:#ffd60a44;font-size:14px}
.empty{padding:24px 18px;text-align:center;color:var(--muted);font-size:14px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.bar2{height:5px;border-radius:3px;background:var(--sep);overflow:hidden;margin-top:6px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.sub{padding:6px 14px 8px 60px;background:var(--card);border-bottom:1px solid var(--sep);font-size:14px}
.sub div{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
#pk{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:40}
#pk.on{display:flex}
#pkbox{background:var(--bg);width:100%;max-width:560px;height:88vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#pkl{overflow:auto;flex:1;background:var(--card);-webkit-overflow-scrolling:touch}
.pkr{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--sep);cursor:pointer}
.pkr:active{background:var(--bg)}.pkr.on{background:rgba(10,124,255,.12)}
.pki{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.pkt{flex:1;min-width:0;word-break:break-word}.pkt small{display:block;color:var(--muted);font-size:12px}
.pkh{padding:6px 14px;font-size:12px;color:var(--muted);text-transform:uppercase;background:var(--bg)}
.pkbtn{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--text);text-align:right;cursor:pointer;padding:0;min-width:0}
.pkbtn.none{color:var(--muted)}
@media (min-width:700px){#pk{align-items:center}#pkbox{border-radius:16px;height:80vh}}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--head);position:sticky;top:0;border-bottom:1px solid var(--sep);gap:8px}
.fld{background:var(--card);margin:10px 12px 0;border-radius:12px;overflow:hidden}
.fr{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--sep);gap:10px}
.fr:last-child{border-bottom:0}
.fr>label{flex:none;width:92px;color:var(--muted);font-size:15px}
.fr input,.fr select{flex:1;border:0;background:transparent;outline:none;min-width:0;text-align:right;font:inherit;font-size:16px;color:var(--text)}
.fr input.big{font-size:24px;font-weight:600}
.seg{display:flex;background:var(--sep);border-radius:9px;padding:2px;margin:12px 12px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:7px;font:inherit;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);font-weight:600}
.hide{display:none!important}
@media (min-width:700px){#ov{align-items:center}#sheet{border-radius:16px;max-height:88vh;margin:20px}}
.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap;margin-top:3px;line-height:1.35;word-break:break-word}
.fr textarea{flex:1;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--text);resize:vertical;min-height:70px;text-align:left;min-width:0}
.ipick{font-size:22px;padding:4px 6px;border-radius:8px;background:none;border:1px solid var(--sep);cursor:pointer}
.ipick.on{background:var(--accent);border-color:var(--accent)}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;pointer-events:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.printonly{display:none}
.rr[data-tx]{cursor:pointer}.rr[data-tx]:active{background:var(--bg)}.ri{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;margin-top:1px}.ic.soft{font-size:21px}.ic.logo{object-fit:cover;background:#fff}.ic svg{display:block}
.rr{display:flex;align-items:flex-start;gap:8px;padding:5px 12px;border-bottom:1px solid var(--sep);font-size:14px;line-height:1.25}
.rr:last-child{border-bottom:0}
.rr .rd{flex:none;width:72px;color:var(--muted);font-size:12px;padding-top:2px}
.rr .mid{flex:1;min-width:0}
.rr .t1{font-size:14px;white-space:normal}
.rr .t2{font-size:12px;white-space:normal}
.rr .amt{font-size:14px;white-space:nowrap}
.rs{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding-left:10px}
.cathead{display:flex;justify-content:space-between;padding:8px 14px 2px;font-weight:700;font-size:14px}
.subhead{display:flex;justify-content:space-between;padding:4px 14px 2px 22px;font-weight:600;font-size:13px;color:var(--muted)}
.mx{overflow-x:auto;margin:0 12px 8px;background:var(--card);border-radius:12px}
.mx table{border-collapse:collapse;font-size:12px;width:100%}
.mx th,.mx td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--sep);white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.mx .indent{padding-left:16px}
.mx .tophead th,.mx .tophead td{font-weight:700}
.mx .totalrow th,.mx .totalrow td{font-weight:700;border-top:2px solid var(--sep)}
@media print{header.top,nav.tabs,.noprint,#hact,#ov,.banner{display:none!important}.printonly{display:block!important}body{padding:0!important;background:#fff!important;color:#000!important;font-size:11px}.card{box-shadow:none!important;border:1px solid #bbb;margin:0 0 6px!important}.hero{background:#eee!important;color:#000!important;margin:6px 0!important;padding:8px!important}.hero .v{font-size:18px!important}.rr{padding:1px 4px!important;font-size:10px!important;line-height:1.15!important;break-inside:avoid}.rr .t1,.rr .amt{font-size:10px!important}.rr .t2,.rs,.rr .rd{font-size:9px!important}.sec{padding:8px 0 2px!important;font-size:11px!important}.cathead,.subhead{font-size:10px!important;padding:3px 4px!important}.mx{overflow:visible!important;margin:0!important}.mx table{font-size:9px!important}.mx th,.mx td{padding:1px 3px!important}}
.brandmark{width:34px;height:34px;object-fit:cover;border-radius:9px;flex:none} @media(min-width:900px){main{max-width:1040px}.card{margin-left:16px;margin-right:16px}.hero{margin-left:16px;margin-right:16px}} @media(max-width:420px){header.top{padding:8px 10px}.brandmark{width:30px;height:30px}nav.tabs button{font-size:11px}}\n.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 24px}
.rc-tile{padding:12px;margin:0!important;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.rc-subs{grid-column:1/-1;margin:0!important}
@media (max-width:360px){.rc-grid{grid-template-columns:1fr}}
</style>
</head>

/* ---------- Informes ---------- */
let R = {q: '', mode: 'mes', from: null, to: null, excl: new Set(), cats: new Set(), tipo: 'todos', view: 'fechas'};
function parseTypedDate(s){
  s = String(s || '').trim();
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);
  let out = null;
  if (m) { let y = +m[3]; if (y < 100) y += 2000; out = y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
  else if ((m = s.match(/^(\d{2})(\d{2})(\d{4})$/))) out = m[3] + '-' + m[2] + '-' + m[1];
  else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) out = m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
  return out && !isNaN(new Date(out + 'T00:00:00')) ? out : null;
}
function pgRange(){
  const cur = curMonth();
  const monthRange = ym => { const [y,m] = ym.split('-').map(Number); return [ym + '-01', ym + '-' + pad(new Date(y, m, 0).getDate())]; };
  switch (R.mode) {
    case 'mes': return monthRange(f.month);
    case 'mes-pasado': return monthRange(shiftMonth(cur, -1));
    case 'trimestre': return [shiftMonth(cur, -2) + '-01', monthRange(cur)[1]];
    case 'anio': { const y = cur.slice(0,4); return [y + '-01-01', y + '-12-31']; }
    case 'anio-pasado': { const y = String(Number(cur.slice(0,4)) - 1); return [y + '-01-01', y + '-12-31']; }
    case 'todo': return ['0000-01-01', '9999-12-31'];
    default: return [R.from || monthRange(cur)[0], R.to || todayStr()];
  }
}
function periodText(){ const [from,to] = pgRange(); return R.mode === 'todo' ? 'Todo el histórico' : fmtDate(from) + ' a ' + fmtDate(to); }
function isLinkedRef(t){ return t.type === 'reembolso' && txMap.has(t.refundOf); }
function describe(t){
  if (t.desc) return t.desc;
  if (isLinkedRef(t)) return 'Reembolso de ' + exLabel(txMap.get(t.refundOf));
  return t.desc || t.payee || (t.splits ? 'Varias categorías' : (t.category ? catPath(t.category) : TYPE_LABEL[t.type]));
}
function catText(t){ return t.splits ? [...new Set(t.splits.map(s => catPath(s.category)))].join(', ') : (t.category ? catPath(t.category) : ''); }
function searchFilter(list, q, field){
  q = String(q == null ? f.q : q).trim();
  field = field || 'desc';
  if (!q) return list;
  const nq = nrm(q);
  const words = x => x.split(/\s+/).map(w => w.replace(/[^a-z0-9]+/g,'')).filter(Boolean);
  const byWords = (text, loose) => { const hay = ' ' + nrm(text).replace(/[^a-z0-9]+/g,' ') + ' '; return words(nq).every(w => (loose || w.length > 4) ? hay.includes(loose ? w : ' '+w) : hay.includes(' '+w+' ')); };
  return list.filter(t => {
    const acc = accMap.get(t.account);
    switch (field) {
      case 'note': return words(nq).every(w => nrm(noteOf(t)).includes(w));
      case 'cat': return byWords(catText(t), true);
      case 'acc': return byWords(acc ? acc.name : '', true);
      case 'amount': {
        const digits = q.replace(/[^0-9]/g,'');
        if (!digits) return false;
        const abs = Math.abs(Number(t.amount)||0);
        const cents = String(Math.round(abs*100));
        const euro = String(Math.trunc(abs));
        return cents.includes(digits) || euro.includes(digits) || money(t.amount).replace(/[^0-9]/g,'').includes(digits);
      }
      case 'date': {
        const d = String(t.date || '');
        const norm = nq.replace(/[^a-z0-9]/g,'');
        const [y,m,dd] = d.split('-');
        const forms = [d, d.replace(/-/g,''), fmtDate(d), (dd||'')+'/'+(m||'')+'/'+(y||''), (m||'')+'/'+(y||''), (m||'')+'-'+(y||'')];
        return d.includes(q) || forms.some(x => nrm(x).replace(/[^a-z0-9]/g,'').includes(norm)) || nrm(fmtDate(d)).includes(nq);
      }
      default: return byWords([t.desc,t.payee,catText(t),acc ? acc.name : ''].join(' '));
    }
  });
}

function reportRows(){
  const [from, to] = pgRange();
  let list = S.transactions.filter(t => t.date >= from && t.date <= to && !isFuture(t) && t.type !== 'transferencia' && t.type !== 'inversion');
  if (R.excl.size) list = list.filter(t => !R.excl.has(t.account));
  if (R.cats.size) list = list.filter(txKeep).map(cutTx);
  if (R.tipo === 'gasto') list = list.filter(t => t.amount < 0 || isLinkedRef(t));
  if (R.tipo === 'ingreso') list = list.filter(t => t.amount > 0 && !isLinkedRef(t));
  const q = nrm(R.q).trim();
  if (q) list = searchFilter(list, q, 'desc');
  return list.sort((a,b) => byAsc(b,a));
}

function byDescTx(a,b){ return byAsc(b,a); }
function lineRows(list){

const PDF_LIBS = [

function loadScriptOnce(url){
  return new Promise((ok, ko) => {
    if (document.querySelector('script[data-src="' + url + '"]')) return ok();
    const s = document.createElement('script');
    s.src = url; s.async = true; s.dataset.src = url;

async function ensurePdfLibs(){

function printCssScoped(){
  const st = [...document.querySelectorAll('style')].find(x => x.textContent.includes('@media print'));
  if (!st) return '';
  const txt = st.textContent;
  const i = txt.indexOf('@media print');
  const open = txt.indexOf('{', i);
  let depth = 0, end = txt.length;
  for (let k = open; k < txt.length; k++) {
    if (txt[k] === '{') depth++;
    else if (txt[k] === '}') { depth--; if (depth === 0) { end = k; break; } }
  }
  const inner = txt.slice(open + 1, end);
  return inner.replace(/([^{}]+)\{([^{}]*)\}/g, (m, sel, body) => {
    const scoped = sel.split(',').map(x => x.trim()).filter(Boolean).map(x => {
      if (x === 'body') return '#pdfhost';
      if (x === 'html') return '';
      return '#pdfhost ' + x;
    }).filter(Boolean).join(', ');
    return scoped ? scoped + '{' + body + '}' : '';
  });
}

async function buildVisualPdf(){

  host.id = 'pdfhost';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;background:#fff;z-index:2147483000;';
  host.style.cssText = 'position:absolute;left:0;top:0;width:800px;background:#fff;color:#000;';
  wrap.appendChild(host);
  host.innerHTML = viewReports();
  host.querySelectorAll('.noprint').forEach(el => el.remove());
  host.querySelectorAll('.sec').forEach(sec => {
    const nx = sec.nextElementSibling;
    if (nx && nx.classList.contains('empty') && /Sin movimientos/.test(nx.textContent)) { nx.remove(); sec.remove(); }
  });
  const pr = host.querySelector('.printonly'); if (pr) pr.style.display = 'block';
  const style = document.createElement('style');
  style.textContent = printCssScoped() + `
#pdfhost h2{font-size:14px!important;margin:0 0 2px!important}
#pdfhost .printonly p{font-size:9px!important;margin:0!important}
#pdfhost .hero{padding:6px 8px!important;margin:4px 0 2px!important}
#pdfhost .sec{padding:6px 0 2px!important}`;
  document.head.appendChild(style);
  document.body.appendChild(wrap);
  // Colores de los iconos en valores RGB fijos (el generador de PDF no entiende hsl con espacios)
  host.querySelectorAll('.ri').forEach(el => {
    const bg = getComputedStyle(el).backgroundColor;
    const ring = (el.style.boxShadow || '').match(/hsl\([^)]*\)/g);
    if (ring) {
      const t = document.createElement('span');
      t.style.color = ring[ring.length - 1];
      wrap.appendChild(t);
      const rc = getComputedStyle(t).color;
      t.remove();
      el.style.boxShadow = 'none';
      el.style.border = '1.5px solid ' + rc;
      el.style.boxSizing = 'border-box';
    }
    el.style.background = bg;
  });

    const hostW = host.offsetWidth, hostH = host.scrollHeight;
    const canvas = await window.html2canvas(host, {scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, width: hostW, height: hostH, windowWidth: hostW, windowHeight: hostH});
    const k = canvas.width / hostW;
    const top0 = host.getBoundingClientRect().top;
    const rel = el => el.getBoundingClientRect().top - top0;
    const relB = el => el.getBoundingClientRect().bottom - top0;
    const cuts = [];
    host.querySelectorAll('.sec, .cathead, .subhead').forEach(el => cuts.push(rel(el)));
    host.querySelectorAll('.rr, .mx tr, .empty, .hero, .printonly').forEach(el => cuts.push(relB(el)));
    const cutList = [...new Set(cuts.map(v => Math.round(v * 10) / 10))].sort((x, y) => x - y);
    const pdf = new window.jspdf.jsPDF({unit: 'pt', format: 'a4', orientation: 'portrait'});

      let end = Math.min(y + pagePx, totalPx);
      if (end < totalPx) {
        const fit = cutList.filter(c => c > y + 20 && c <= end);
        if (fit.length) end = fit[fit.length - 1];

      const sy = Math.round(y * k), sh = Math.max(1, Math.round((end - y) * k));

      part.width = canvas.width; part.height = sh;
      part.getContext('2d').drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
      if (!first) pdf.addPage();
      first = false;
      pdf.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, contentW, sh * contentW / canvas.width);
      y = end;
    }
    return pdf.output('blob');
  } finally { wrap.remove(); style.remove(); }
}

function catBlock(title, list, expenseMode){
  if (!list.length) return '';
  const tot = new Map();
  for (const t of list) {
    const top = topCat(t.category);
    const key = top ? top.id : 0;
    const name = top ? top.name : 'Sin categoría';
    const e = tot.get(key) || {name, total: 0, kids: new Map()};
    e.total += t.amount;
    const kn = (t.category && top && t.category !== top.id) ? catPath(t.category).replace(top.name + ' › ', '') : (top ? 'Sin subcategoría' : 'Sin categoría');
    e.kids.set(kn, (e.kids.get(kn) || 0) + t.amount);
    tot.set(key, e);
  }
  let arr = [...tot.values()].sort((a,b) => Math.abs(b.total) - Math.abs(a.total));
  if (expenseMode) arr = arr.filter(e => e.total < 0);
  if (!arr.length) return '';
  const max = Math.abs(arr[0].total) || 1;
  const all = Math.abs(list.reduce((s,t) => s + t.amount, 0)) || 1;
  let h = `<div class="sec"><span>${title}</span></div><div class="card">`;
  for (const e of arr) {
    const kids = [...e.kids.entries()].sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]));
    h += `<details><summary class="row"><div class="ic" style="background:${colorOf(e.name)}">${esc((e.name||'?')[0].toUpperCase())}</div><div class="mid"><div class="t1">${esc(e.name)}</div><div class="bar2"><i style="width:${Math.round(Math.abs(e.total)/max*100)}%"></i></div></div><div class="amt">${money(e.total)}<small>${Math.round(Math.abs(e.total)/all*100)}%</small></div></summary>`;
    h += kids.map(([n,v]) => `<div class="sub"><div><span>${esc(n)}</span><span>${money(v)}</span></div></div>`).join('');
    h += '</details>';
  }
  return h + '</div>';
}

function formUI(){
  document.querySelectorAll('#kind button').forEach(b => b.classList.toggle('on', b.dataset.k === FK));
  const tr = FK === 'transferencia';
  $('#row_to').classList.toggle('hide', !tr);
  const rb = FK === 'reembolso';
  $('#row_cat').classList.toggle('hide', tr || rb || FSPL !== null);
  $('#row_pay').classList.toggle('hide', tr || rb);
  $('#row_ref_box').classList.toggle('hide', !rb);
  $('#lbl_acc').textContent = tr ? 'Desde' : 'Cuenta';
  splitUI();
}
function splitUI(){
  const box = $('#splitbox'); if (!box) return;
  const tr = FK === 'transferencia';
  if (tr || FK === 'reembolso') { box.innerHTML = ''; return; }
  if (FSPL === null) {
    box.innerHTML = `<div class="fld"><div class="fr" style="justify-content:center"><button class="btn" data-act="splitopen">Dividir en varias categorías</button></div></div>`;
    return;
  }
  const abs = moneyDigits($('#f_amt').value);
  const sum = FSPL.reduce((s,l) => s + Math.abs(l.amount || 0), 0);
  const ok = Math.abs(sum - abs) < 0.005;
  box.innerHTML = `<div class="fld">` + FSPL.map((l,i) => `<div class="fr"><button type="button" class="pkbtn${l.category ? '' : ' none'}" style="text-align:left" data-pksplit="${i}">${catBtn(l.category)}</button><input data-sa="${i}" type="text" inputmode="numeric" data-money="1" value="${l.amount ? moneyInputFormat(Math.round(Math.abs(l.amount)*100)) : ''}" style="flex:none;width:96px;text-align:right"><button class="btn danger" data-sdel="${i}">✕</button></div>`).join('') +
    `<div class="fr" style="justify-content:space-between"><button class="btn" data-sadd="1">+ Añadir línea</button><span class="${ok ? '' : 'neg'}">${money(sum)} de ${money(abs)}</span></div>` +
    `<div class="fr" style="justify-content:center"><button class="btn" data-act="splitclose">Quitar la división</button></div></div>`;
}
function splitOpen(){
  const sg = FK === 'gasto' ? -1 : 1;
  const amt = moneyDigits($('#f_amt').value);
  FSPL = [{category: Number($('#f_cat').value) || null, amount: sg * amt}];
  formUI();
}
function splitClose(){ FSPL = null; formUI(); }
function closeForm(){ pkClose(); $('#ov').classList.remove('on'); $('#sheet').innerHTML = ''; FID = null; FCAT = null; FACC = null; FSPL = null; FICON = null; }
function removeOriginal(){
  if (FID == null) return;
  const orig = S.transactions.find(t => t.id === FID);
  if (!orig) return;
  const ids = new Set([orig.id]);
  if (orig.pair != null) ids.add(orig.pair);
  ids.forEach(i => gone('tx', i));
  S.transactions = S.transactions.filter(t => !ids.has(t.id));
}
function saveForm(){
  const amt = moneyDigits($('#f_amt').value);
  if (!amt) { alert('Introduce un importe'); return; }
  const date = $('#f_date').value;
  if (!date) { alert('Falta la fecha'); return; }
  const acc = Number($('#f_acc').value);
  const tr = FK === 'transferencia';
  const to = Number($('#f_to').value);
  if (tr && to === acc) { alert('La cuenta de origen y la de destino son la misma'); return; }
  const sg = FK === 'gasto' ? -1 : 1;
  let splits = null;
  if (!tr && FSPL) {
    const sumAbs = FSPL.reduce((s,l) => s + Math.abs(l.amount || 0), 0);
    if (Math.abs(sumAbs - amt) > 0.005) { alert('Las líneas suman ' + money(sumAbs) + ' y el total es ' + money(amt)); return; }
    splits = FSPL.map(l => ({category: l.category || null, amount: Math.round(sg * Math.abs(l.amount) * 100) / 100}));
  }
  const orig = FID != null ? S.transactions.find(t => t.id === FID) : null;
  const note = $('#f_note').value.trim();
  const desc = $('#f_desc').value.replace(/\s+/g, ' ').trim();
  const cat = Number($('#f_cat').value) || null;
  const pay = $('#f_pay').value.trim() || null;
  let refId = null;
  if (FK === 'reembolso') {
    refId = refIdFromLabel($('#f_ref').value);
    const ex = refId != null ? txMap.get(refId) : null;
    if (!ex || ex.type !== 'gasto') { alert('Elige el gasto al que corresponde el reembolso de la lista'); return; }
    const already = refundsOf(refId).filter(r => !orig || r.id !== orig.id).reduce((s,r) => s + r.amount, 0);
    if (already + amt > Math.abs(ex.amount) + 0.005 && !confirm('Los reembolsos de ese gasto superarían su importe. ¿Guardar igualmente?')) return;
  }
  if (FK === 'gasto' && orig && orig.type === 'gasto') {
    const sumRef = refundsOf(orig.id).reduce((s,r) => s + r.amount, 0);
    if (sumRef > amt + 0.005 && !confirm('Este gasto ya tiene reembolsos por ' + money(sumRef) + ', más que el nuevo importe. ¿Guardar igualmente?')) return;
  }
  const keepId = orig && !tr && orig.type !== 'transferencia' ? orig.id : null;
  removeOriginal();
  let nid = keepId != null ? keepId : S.transactions.reduce((m,t) => Math.max(m, t.id), 0) + 1;
  touch('tx', nid); if (tr) touch('tx', nid + 1);
  if (tr) {
    S.transactions.push({id:nid, date, amount:-amt, account:acc, type:'transferencia', category:null, payee:null, desc, note, transferAccount:to, pair:nid+1, reconciled:true});
    S.transactions.push({id:nid+1, date, amount:amt, account:to, type:'transferencia', category:null, payee:null, desc, note, transferAccount:acc, pair:nid, reconciled:true});
  } else {
    if (FK === 'reembolso') {
      S.transactions.push({id:nid, date, amount: amt, account:acc, type:'reembolso', category:null, splits:null, payee:null, desc, note, transferAccount:null, pair:null, reconciled:true, refundOf: refId});
    } else {
      const type = FK === 'ingreso' ? ((orig && orig.type === 'reembolso') ? 'reembolso' : 'ingreso') : 'gasto';
      S.transactions.push({id:nid, date, amount: sg * amt, account:acc, type, category: splits ? null : cat, splits, payee:pay, desc, note, transferAccount:null, pair:null, reconciled:true});
    }
  }
  reindex(); save(); closeForm(); render();
}
function deleteTx(){
  if (FID == null) return;
  const n = refundsOf(FID).length;
  if (!confirm('¿Eliminar este movimiento?' + (n ? ' Sus ' + n + ' reembolsos quedarán como ingresos sueltos.' : ''))) return;
  S.transactions.forEach(t => { if (t.refundOf === FID) t.refundOf = null; });
  removeOriginal(); reindex(); save(); closeForm(); render();
}

function moveBefore(src, target){

  const ids = list.map(x => x.id).filter(id => id !== src);
  ids.splice(ids.indexOf(target), 0, src);

}

const ICON_RULES = [[/hacienda|impuesto|tasa|ibi\b|plusvalia/,'🏛️'],[/loteria|apuesta|primitiva|quiniela/,'🎰'],[/deceso|cementerio|funer|flores/,'🕯️'],[/sindicato|ccoo|juridic/,'🤝'],[/visual|gafas|optic|lentes/,'👓'],[/seguro medico|sanitaria|clinica|hospital|salud/,'🩺'],[/dental|dentista/,'🦷'],[/cuidado personal|higiene|peluquer|belleza/,'🧴'],[/mueble|accesorio|decorac/,'🛋️'],[/gadget/,'🎧'],[/gas\b|butano/,'🔥'],[/internet|banda ancha|fibra/,'📡'],[/gimnasio|deporte/,'🏋️'],[/ocio|tiempo libre/,'🎭'],[/restaur|cena|cafeteria/,'🍽️'],[/lavado/,'🚿'],[/comunidad|escalera/,'🏢'],[/regalo/,'🎁'],[/intereses|rendimiento|dividendo/,'📈'],[/vivienda|hipoteca|alquiler|casa|hogar|fincas|comunidad/,'🏠'],[/autom|coche|vehiculo|parking|aparcamiento/,'🚗'],[/gasolina|combustible/,'⛽'],[/aliment|superm|compra|comida/,'🛒'],[/restaur|bar|cafe|comer fuera/,'🍽️'],[/ropa|calzado|moda/,'👕'],[/tecno|electr|inform|ordenador|movil|telefono movil/,'💻'],[/viaje|vuelo|hotel|vacacion/,'✈️'],[/salud|medic|farmac|dentista/,'💊'],[/educa|formac|curso|colegio|universidad|escuela/,'🎓'],[/regalo/,'🎁'],[/luz|electric|energia/,'💡'],[/agua/,'💧'],[/telefon|internet|comunicac/,'📱'],[/ocio|cine|entreten|suscrip/,'🎬'],[/mascota|perro|gato|animal|veterin/,'🐶'],[/banco|comision|financ|seguro/,'🏦'],[/sueldo|nomina|salario|ingreso/,'💰'],[/repar|manten|bricol|herramienta/,'🔧'],[/transporte|bus|tren|metro|taxi|peaje/,'🚌'],[/hijo|nino|bebe|guarderia/,'👶'],[/libro|papeleria/,'📚'],[/juego|videojuego/,'🎮'],[/impuesto|tasa|hacienda|jurid|abogad|notari/,'🧾'],[/jard|planta/,'🌳'],[/deporte|gimnas/,'🏋️'],[/musica/,'🎵'],[/envio|paquete/,'📦'],[/peluquer|belleza|higiene/,'💇']];
function nrm(s){ return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function iconOf(c){
  if (!c) return null;
  if (c.icon) return c.icon;
  const n = nrm(c.name);
  for (const [re, ic] of ICON_RULES) if (re.test(n)) return ic;
  const p = c.parent ? catMap.get(c.parent) : null;
  if (p) return iconOf(p);
  return null;
}

let CQ = '', CEXP = new Set();
function viewCategories(){

function catListHtml(){
  const byName = (a,b) => a.name.localeCompare(b.name,'es');
  const kids = id => S.categories.filter(x => x.parent === id).sort(byName);
  const cnt = new Map();
  S.transactions.forEach(t => { const ids = new Set(t.splits ? t.splits.map(s => s.category) : []); if (t.category != null) ids.add(t.category); ids.forEach(id => { if (id != null) cnt.set(id, (cnt.get(id) || 0) + 1); }); });
  const ws = nrm(CQ).split(/\s+/).map(w => w.replace(/[^a-z0-9]+/g, '')).filter(Boolean);
  let show = null;
  if (ws.length) {
    const find = sub => {
      const out = new Set();
      const addDesc = c => { out.add(c.id); kids(c.id).forEach(addDesc); };
      S.categories.forEach(c => {
        const n = nrm(c.name).replace(/[^a-z0-9]+/g, ' ');
        if (!ws.every(w => sub ? n.includes(w) : (' ' + n + ' ').includes(' ' + w))) return;

        while (p && g++ < 10) { out.add(p.id); p = p.parent != null ? catMap.get(p.parent) : null; }
      });
      return out;
    };
    show = find(false); if (!show.size) show = find(true);
    if (!show.size) return '<div class="empty">Ninguna categoría coincide</div>';
  }
  const rowFor = (c, depth, nk, open) => {
    const ic = catIconOf(c.id);
    return `<div class="row" data-cat="${c.id}" style="padding-left:${14 + depth*26}px"><div class="ic${ic ? ' soft' : ''}" style="${ic ? icStyle(c.id) : 'background:' + colorOf(c.name)};width:${depth ? 28 : 34}px;height:${depth ? 28 : 34}px;font-size:${depth ? 17 : 20}px">${ic || esc((c.name||'?')[0].toUpperCase())}</div><div class="mid"><div class="t1">${esc(c.name)}</div><div class="t2">${cnt.get(c.id) || 0} movimientos</div></div>${nk ? `<button class="btn" data-ctog="${c.id}" style="min-width:56px">${open ? '▾' : '▸'} ${nk}</button>` : ''}<button class="btn" data-cat="${c.id}">Editar</button></div>`;
  };
  const walk = (c, depth) => {
    if (show && !show.has(c.id)) return '';
    const ks = kids(c.id), open = show ? true : CEXP.has(c.id);
    return rowFor(c, depth, ks.length, open) + (open ? ks.map(k => walk(k, depth + 1)).join('') : '');
  };
  const roots = S.categories.filter(isTop).sort(byName);
  return roots.map(r => { const w = walk(r, 0); return w ? `<div class="card" style="margin:12px">${w}</div>` : ''; }).join('');
}

let priceSrc = 0;
const PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),

function isManualHolding(h){ return !h || !h.symbol || /^MINTOS/i.test(h.symbol) || /mintos/i.test(h.name || ''); }
async function getText(u, ms){
  const ctrl = new AbortController();
  const tm = setTimeout(() => ctrl.abort(), ms || 9000);
  try {
    const r = await fetch(u, {signal: ctrl.signal, cache:'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.text();
  } finally { clearTimeout(tm); }
}
function parseYahoo(txt){
  let data; try { data = JSON.parse(txt); } catch(e) { throw new Error('no json'); }
  // allorigins /get envuelve la respuesta en {contents:"..."}
  if (data && typeof data.contents === 'string') { try { data = JSON.parse(data.contents); } catch(e) {} }
  const result = data && data.chart && data.chart.result && data.chart.result[0];
  const m = result && result.meta;
  if (!m) throw new Error('sin datos');
  const q = result.indicators && result.indicators.quote && result.indicators.quote[0];
  const closes = q && q.close ? q.close.filter(v => Number.isFinite(v) && v > 0) : [];
  const price = Number(m.regularMarketPrice) > 0 ? Number(m.regularMarketPrice) : (closes.length ? closes[closes.length-1] : 0);
  if (!(price > 0)) throw new Error('sin precio');
  const stamp = Number(m.regularMarketTime) || (result.timestamp && result.timestamp[result.timestamp.length-1]) || Date.now()/1000;
  const prev = closes.length >= 2 ? closes[closes.length-2] : (m.previousClose || m.chartPreviousClose || null);
  return {price, date: dayOf(new Date(stamp * 1000)), prev};
}
function stooqSymbol(sym){
  const s = String(sym).toLowerCase();
  if (s.endsWith('.mc')) return s.slice(0,-3) + '.es';
  if (/\.[a-z]{1,3}$/.test(s)) return s;
  return s + '.us';
}
function parseStooq(txt){
  const lines = txt.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('sin datos');
  const hdr = lines[0].toLowerCase().split(','), row = lines[1].split(',');
  const price = parseFloat(row[hdr.indexOf('close')]);
  const date = row[hdr.indexOf('date')];
  if (!(price > 0) || !/^\d{4}-\d{2}-\d{2}$/.test(date || '')) throw new Error('sin precio');
  return {price, date, prev: null};
}
async function fetchPrice(sym){
  const stamp = Date.now();
  const path = '/v8/finance/chart/' + encodeURIComponent(sym) + '?interval=1d&range=5d&includePrePost=false';
  const yh = ['https://query1.finance.yahoo.com' + path, 'https://query2.finance.yahoo.com' + path];
  const sq = 'https://stooq.com/q/l/?s=' + encodeURIComponent(stooqSymbol(sym)) + '&f=sd2t2ohlcv&h&e=csv';
  const jobs = [];
  yh.forEach(u => jobs.push(getText(u + '&_=' + stamp).then(parseYahoo)));
  yh.forEach(u => PROXIES.forEach(px => jobs.push(getText(px(u + '&_=' + stamp)).then(parseYahoo))));
  // Respaldo: Stooq (solo se usa si Yahoo no responde por ningún camino)
  const stooq = () => Promise.any([sq].flatMap(u => [getText(u).then(parseStooq)].concat(PROXIES.map(px => getText(px(u)).then(parseStooq)))));
  try { return await Promise.any(jobs); }
  catch (e) { try { return await stooq(); } catch (e2) { throw new Error('sin respuesta'); } }
}

async function updatePrices(manual){

/* ---------- Registro de cambios del usuario (para fusionar sin pisarlos) ---------- */
function touch(coll, id){
  S.touched = S.touched || {}; S.touched[coll] = S.touched[coll] || {}; S.touched[coll][id] = Date.now();
  if (S.deleted && S.deleted[coll]) delete S.deleted[coll][id];
}
function gone(coll, id){ S.deleted = S.deleted || {}; S.deleted[coll] = S.deleted[coll] || {}; S.deleted[coll][id] = 1; }
function canon(v){
  if (v === undefined) return 'null';
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}
/* Fusiona datos externos en los de este dispositivo: añade lo que falta, actualiza lo que no has cambiado
   aquí, conserva tus cambios y aplica los borrados hechos en otro dispositivo (salvo que los hayas editado aquí). */
function mergeData(inc){
  const tc = S.touched || {}, st = {add: 0, upd: 0, keep: 0, del: 0};
  S.deleted = S.deleted || {};
  const applyDeletes = (key, local) => {
    const rem = (inc.deleted && inc.deleted[key]) || {};
    S.deleted[key] = S.deleted[key] || {};
    let out = local;
    for (const k of Object.keys(rem)) {
      const id = Number(k);
      if (tc[key] && tc[key][id]) continue;
      S.deleted[key][id] = 1;
      const before = out.length; out = out.filter(x => x.id !== id); st.del += before - out.length;
    }
    return out;
  };
  const mergeColl = (key, local, incoming) => {
    const idx = new Map(local.map((x, i) => [x.id, i]));
    const out = local.slice();
    for (const r of incoming) {
      if (!idx.has(r.id)) { if (S.deleted[key] && S.deleted[key][r.id]) continue; out.push(JSON.parse(JSON.stringify(r))); st.add++; continue; }
      const i = idx.get(r.id);
      if (tc[key] && tc[key][r.id]) { st.keep++; continue; }
      if (canon(out[i]) !== canon(r)) { out[i] = JSON.parse(JSON.stringify(r)); st.upd++; }
    }
    return out;
  };
  S.accounts = mergeColl('acc', applyDeletes('acc', S.accounts), inc.accounts || []);
  S.categories = mergeColl('cat', applyDeletes('cat', S.categories), inc.categories || []);
  S.transactions = mergeColl('tx', applyDeletes('tx', S.transactions), inc.transactions || []);
  S.reports = mergeColl('rep', applyDeletes('rep', S.reports || []), inc.reports || []);
  S.holdings = S.holdings || [];
  const hid = new Set(S.holdings.map(h => h.id));
  (inc.holdings || []).forEach(h => { if (!hid.has(h.id)) S.holdings.push(JSON.parse(JSON.stringify(h))); });
  const ord = new Set(S.accountOrder || []);
  S.accountOrder = [...(S.accountOrder || []), ...(inc.accountOrder || []).filter(id => !ord.has(id))];
  reindex();
  return st;
}

  if (!valid(inc)) { alert('El archivo no es una copia válida de esta app.'); return; }
  if (!confirm('Se añadirán los movimientos, cuentas y categorías que falten, y se actualizarán los que no hayas cambiado en este dispositivo. Lo que hayas cambiado aquí se mantiene. Antes se guarda una copia. ¿Continuar?')) return;

}

function descendantsOf(id){

function bankDate(v){
  if (v instanceof Date) return dayOf(v);
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); }
  const s = String(v || '').trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[0] : null;
}
function bankAmt(v){
  if (typeof v === 'number') return v;
  const s = String(v || '').replace(/\s/g, '').replace(/\+$/, '');
  if (!s) return NaN;
  return /,\d{1,2}$/.test(s) ? parseFloat(s.replace(/\./g, '').replace(',', '.')) : parseFloat(s);
}
function movsFromXls(buf){
  const wb = XLSX.read(buf, {type: 'array', cellDates: true});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: null});
  const hi = rows.findIndex(r => r.some(c => /^fecha/i.test(String(c || '').trim())) && r.some(c => /concepto/i.test(String(c || ''))) && r.some(c => /^importe/i.test(String(c || '').trim())));
  if (hi < 0) throw new Error('no encuentro las columnas Fecha, Concepto e Importe');
  const head = rows[hi].map(c => String(c || '').trim());
  const dc = head.findIndex(c => /^fecha/i.test(c));
  const cc = head.findIndex(c => /concepto/i.test(c));
  const ac = head.findIndex(c => /^importe/i.test(c));
  const out = [];
  rows.slice(hi + 1).forEach(r => {
    const date = bankDate(r[dc]), amount = bankAmt(r[ac]);
    if (!date || isNaN(amount) || /^saldo/i.test(String(r[cc] || '').trim())) return;
    out.push({date, amount: Math.round(amount * 100) / 100, concept: String(r[cc] || '').replace(/\s+/g, ' ').trim()});
  });
  return out;
}
async function movsFromPdf(buf){
  await loadScriptOnce(PDFJS_LIB);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await lib.getDocument({data: new Uint8Array(buf)}).promise;
  let items = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    tc.items.forEach(it => { const s = it.str.trim(); if (s) items.push({s, x: it.transform[4], y: Math.round(it.transform[5]) - p * 100000}); });
  }
  const lines = [];
  items.sort((a, b) => b.y - a.y || a.x - b.x).forEach(it => {
    let ln = lines.find(l => Math.abs(l.y - it.y) <= 2);
    if (!ln) { ln = {y: it.y, items: []}; lines.push(ln); }
    ln.items.push(it);
  });
  lines.forEach(l => l.items.sort((a, b) => a.x - b.x));
  const hdr = lines.find(l => l.items.some(i => i.s === 'DEBE') && l.items.some(i => i.s === 'HABER'));
  if (!hdr) throw new Error('no encuentro las columnas DEBE y HABER del PDF');
  const xDebe = hdr.items.find(i => i.s === 'DEBE').x, xHaber = hdr.items.find(i => i.s === 'HABER').x;
  const mid = (xDebe + xHaber) / 2;
  const out = [];
  lines.forEach(l => {
    const d = l.items[0];
    if (!d || !/^\d{2}\/\d{2}\/\d{4}$/.test(d.s)) return;
    const amtIdx = l.items.map((it, i) => /^\d{1,3}(\.\d{3})*,\d{2}\+?$/.test(it.s) ? i : -1).filter(i => i > 1).pop();
    if (amtIdx === undefined) return;
    const am = l.items[amtIdx];
    const val = bankAmt(am.s) * (am.x < mid ? -1 : 1);
    const concept = l.items.slice(2, amtIdx).map(i => i.s).join(' ');
    out.push({date: bankDate(d.s), amount: Math.round(val * 100) / 100, concept});
  });
  return out;
}
async function importBankFile(file){
  let movs;
  try {
    const buf = await file.arrayBuffer();
    if (/\.pdf$/i.test(file.name)) movs = await movsFromPdf(buf);
    else { await loadScriptOnce(XLS_LIB); movs = movsFromXls(buf); }
  } catch (e) { alert('No se ha podido leer el extracto: ' + e.message); return; }
  if (!movs.length) { alert('No he encontrado movimientos en ese archivo.'); return; }
  const accs = S.accounts.filter(a => !a.archived);
  const pick = prompt('¿A qué cuenta corresponde este extracto? Escribe el número:\n' + accs.map((a, i) => (i + 1) + '. ' + a.name).join('\n'));
  const acc = accs[Number(pick) - 1];
  if (!acc) return;
  const existing = S.transactions.filter(t => t.account === acc.id);
  const used = new Set();
  const findDup = m => {
    let best = null, bestD = 4; // hasta 3 días de diferencia
    existing.forEach(t => {
      if (used.has(t.id) || Math.abs(t.amount - m.amount) > 0.005) return;
      const d = Math.abs(new Date(t.date) - new Date(m.date)) / 864e5;
      if (d < bestD) { best = t; bestD = d; }
    });
    return best;
  };
  const catByDesc = new Map();
  S.transactions.forEach(t => {
    if (!t.category || t.splits) return;
    const k = nrm(t.desc || t.payee || '').replace(/[^a-z0-9]+/g, ' ').trim();
    if (!k) return;
    if (!catByDesc.has(k)) catByDesc.set(k, new Map());
    const m = catByDesc.get(k); m.set(t.category, (m.get(t.category) || 0) + 1);
  });
  const add = []; let skipped = 0, transfers = 0;
  movs.sort((a, b) => a.date.localeCompare(b.date)).forEach(m => {
    const dup = findDup(m);
    if (dup) { used.add(dup.id); skipped++; return; }
    if (/traspaso|transferencia/i.test(m.concept)) transfers++;
    const key = nrm(m.concept).replace(/[^a-z0-9]+/g, ' ').trim();
    let cat = null;
    if (catByDesc.has(key)) { let best = 0; catByDesc.get(key).forEach((n, c) => { if (n > best) { best = n; cat = c; } }); }
    add.push({date: m.date, amount: m.amount, desc: m.concept, category: cat});
  });
  if (!add.length) { alert('No hay movimientos nuevos en ' + acc.name + '. ' + skipped + ' ya estaban.'); return; }
  const warn = transfers ? '\n\nOjo: ' + transfers + ' parecen traspasos entre cuentas; revísalos por si cuentan dos veces.' : '';
  if (!confirm('Se añadirán ' + add.length + ' movimientos nuevos a ' + acc.name + ' y se omitirán ' + skipped + ' que ya estaban. Se conservan sus categorías.' + warn + '\n\n¿Continuar?')) return;
  try { localStorage.setItem(KEY + '-antes-importar', JSON.stringify(S)); } catch (e) {}
  let nid = S.transactions.reduce((mx, t) => Math.max(mx, t.id), 0) + 1;
  add.forEach(m => {
    touch('tx', nid);
    S.transactions.push({id: nid++, date: m.date, amount: m.amount, account: acc.id, type: m.amount < 0 ? 'gasto' : 'ingreso', category: m.category, splits: null, payee: null, desc: m.desc, note: '', transferAccount: null, pair: null, reconciled: false});
  });
  reindex(); save(); render();
  alert(add.length + ' movimientos añadidos a ' + acc.name + '.');
}

$('#fileIn').addEventListener('change', e => {

const EXPORT_LABELS = {
  id:'Identificador', cuenta:'Cuenta', valor:'Valor actual', name:'Nombre', type:'Tipo', opening:'Saldo inicial', inNetWorth:'Incluir en patrimonio', archived:'Archivada', group:'Grupo',
  date:'Fecha', amount:'Importe', account:'Cuenta', category:'Categoría', splits:'Desglose', pair:'Movimiento relacionado', payee:'Beneficiario', note:'Nota',
  transferAccount:'Cuenta de destino', reconciled:'Conciliado', desc:'Descripción', parent:'Categoría principal', symbol:'Símbolo', shares:'Participaciones',
  price:'Precio', priceDate:'Fecha del precio', prevClose:'Cierre anterior', cost:'Coste', accountValue:'Valor de la cuenta', available:'Disponible',
  loans:'Préstamos', profitability:'Rentabilidad', cash:'Efectivo', investments:'Inversiones', pending:'Pendiente', late:'Atrasado'
};
function exportLabel(k){ return EXPORT_LABELS[k] || String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase()); }
function exportValue(v){
  if(Array.isArray(v)) return v.map(x=>typeof x==='object'&&x!==null?Object.entries(x).map(([k,z])=>exportLabel(k)+': '+(z==null?'':z)).join(' · '):x).join(' | ');
  if(v&&typeof v==='object') return Object.entries(v).map(([k,z])=>exportLabel(k)+': '+(z==null?'':z)).join(' · ');
  if(typeof v==='boolean') return v?'Sí':'No';
  return v==null?'':v;
}
function rowsForExport(items, omit=[]){
  const keys=[], seen=new Set();
  (items||[]).forEach(o=>Object.keys(o||{}).forEach(k=>{if(!omit.includes(k)&&!seen.has(k)){seen.add(k);keys.push(k);}}));
  return [[...keys.map(exportLabel)],...(items||[]).map(o=>keys.map(k=>exportValue(o&&o[k])))];
}

  const entries=sheets.map((sh,i)=>{const rows=sh.rows||[['Sin datos']];const header=rows[0]||[];const monetaryCols=new Set(header.map((h,ci)=>moneyHeader.test(String(h))?ci:-1).filter(ci=>ci>=0));const body=rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((v,ci)=>{if(v===null||v===undefined||v==='')return '';const ref=colName(ci)+(ri+1);if(typeof v==='number'&&Number.isFinite(v)){const st=ri>0&&monetaryCols.has(ci)?' s="1"':'';return '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';}return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlClean(v)+'</t></is></c>';}).join('')+'</row>').join('');return {name:'xl/worksheets/sheet'+(i+1)+'.xml',data:H+'<worksheet xmlns="'+NS+'"><sheetData>'+body+'</sheetData></worksheet>'};});
  const types='<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((x,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>';
  const wb='<workbook xmlns="'+NS+'" xmlns:r="'+RNS+'"><sheets>'+sheets.map((x,i)=>'<sheet name="'+xmlClean(safeName(x.name))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>';
  const rel='<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((x,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  const files=[{name:'[Content_Types].xml',data:H+types},{name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},{name:'xl/workbook.xml',data:H+wb},{name:'xl/_rels/workbook.xml.rels',data:H+rel},{name:'xl/styles.xml',data:styles},...entries];download(zipStore(files),filename);

const MINTOS_FIELDS = [
  ['accountValue','Valor de la cuenta'],['available','Fondos disponibles'],['loans','Préstamos'],
  ['profitability','Rentabilidad'],['cash','Efectivo en cartera'],['investments','Inversiones'],
  ['pending','Pagos pendientes'],['late','Atrasado']
];
function isMintosAcc(id){ const a = accMap && accMap.get(id); return !!(a && /mintos/i.test(a.name || '')); }
function mintosSnapshots(){
  if (!Array.isArray(S.mintosSnapshots)) {
    S.mintosSnapshots = [{date:'2026-11-09',accountValue:485.23,available:0.09,loans:485.13,profitability:189.53,cash:2.51,investments:339.38,pending:9.63,late:133.60}];
  }
  return S.mintosSnapshots;
}
function mintosMoney(v){ return (Number(v)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR',useGrouping:true}); }
function mintosView(){
  const hist = [...mintosSnapshots()].sort((a,b)=>b.date.localeCompare(a.date));
  const latest = hist[0] || {};
  const prev = hist[1] || null;
  const fields = MINTOS_FIELDS.map(([k,label]) => {
    const val = latest[k] == null ? 0 : latest[k];
    const diff = prev ? Number(val)-Number(prev[k]||0) : null;
    return `<div class="row" style="cursor:default"><div class="mid"><div class="t1">${label}</div></div><div class="amt">${mintosMoney(val)}${diff===null?'':`<small class="${diff>0?'pos':diff<0?'neg':''}">${diff>0?'+':''}${mintosMoney(diff)}</small>`}</div></div>`;
  }).join('');
  const inputs = MINTOS_FIELDS.map(([k,label])=>`<div class="fr"><label style="width:155px">${label}</label><input type="number" step="0.01" min="0" id="mi_${k}" value="${latest[k]??0}"></div>`).join('');
  const history = hist.map(h=>`<div class="row" style="cursor:default"><div class="mid"><div class="t1">${new Date(h.date+'T12:00:00').toLocaleDateString('es-ES')}</div><div class="t2">Valor de la cuenta · Rentabilidad</div></div><div class="amt">${mintosMoney(h.accountValue)}<small>${mintosMoney(h.profitability)}</small></div></div>`).join('');
  const editor = mintosEditing ? `<div class="fld"><div class="fr"><label>Fecha</label><input type="date" id="mi_date" value="${latest.date||'2026-11-09'}"></div>${inputs}</div><div style="padding:8px 12px 12px"><button class="btn primary" style="width:100%" data-act="mintos-save">Guardar lectura</button></div>` : '';
  return `<div class="sec" style="padding-top:10px"><span>Seguimiento Mintos</span><span>${latest.date||''}</span></div>
  <div style="padding:0 12px 10px"><button class="btn primary" style="width:100%" data-act="mintos-edit">${mintosEditing?'Cerrar introducción':'＋ Introducir / actualizar datos'}</button></div>
  ${editor}
  <div class="sec">Última lectura de Mintos <span>${latest.date||''}</span></div><div class="card">${fields||'<div class="empty">Introduce la primera lectura</div>'}</div>
  <div class="sec">Histórico de lecturas</div><div class="card">${history||'<div class="empty">Todavía no hay lecturas</div>'}</div>
  <div class="banner">Introduce manualmente las cifras tal como aparecen en la aplicación de Mintos. Al actualizar, los campos se rellenan con los últimos valores guardados y se conserva cada lectura por fecha.</div>`;
}
function saveMintosSnapshot(){
  const date = document.getElementById('mi_date')?.value;
  if (!date) { alert('Indica la fecha de la lectura.'); return; }
  const snap = {date};
  for (const [k] of MINTOS_FIELDS) {
    const el=document.getElementById('mi_'+k);
    const n=Number(el?.value);
    if (!Number.isFinite(n) || n<0) { alert('Revisa el importe de '+k+'.'); return; }
    snap[k]=Math.round(n*100)/100;
  }
  const arr=mintosSnapshots(), idx=arr.findIndex(x=>x.date===date);
  if (idx>=0) { if (!confirm('Ya existe una lectura de esa fecha. ¿Quieres sustituirla?')) return; arr[idx]=snap; }
  else arr.push(snap);
  arr.sort((a,b)=>a.date.localeCompare(b.date));
  mintosEditing = false;
  save(); render();
}

function render(){
  $('#tabs').innerHTML = TABS.map(([k,g,l]) => `<button class="${(view === k || (k === 'ajustes' && view === 'categorias')) ? 'on' : ''}" data-tab="${k}"><span class="g">${g}</span>${l}</button>`).join('');
  const titles = {cuentas:'Cuentas', movimientos:'Movimientos', informes:'Pérdidas y ganancias', ajustes:'Ajustes', categorias:'Categorías'};
  let title = titles[view];
  if (view === 'movimientos' && f.account && accMap.get(f.account)) title = accMap.get(f.account).name;
  $('#title').textContent = title;
  let hact = '';
  if (view === 'movimientos') {
    if (f.account) hact += `<button class="btn" data-act="back">‹ Cuentas</button><button class="btn" data-act="accedit">Editar</button>`;
    if (isMintosAcc(f.account)) hact += `<button class="btn" data-act="mintos-panel">${mintosPanelOpen ? 'Panel ✓' : '🪙 Panel'}</button>`;
    hact += `<button class="btn" data-act="selmode">${selMode ? 'Listo' : 'Seleccionar'}</button><button class="btn primary" data-act="new">+ Nuevo</button>`;
  } else if (view === 'cuentas') {
    hact = `<button class="btn" data-act="reorder">${reorder ? 'Listo' : 'Ordenar'}</button><button class="btn primary" data-act="accnew">+ Cuenta</button>`;
  } else if (view === 'categorias') {
    hact = `<button class="btn" data-act="settings">‹ Ajustes</button><button class="btn primary" data-act="catnew">+ Categoría</button>`;
  }
  $('#hact').innerHTML = hact;
  const banner = (MIGRATED ? `<div class="banner">Datos actualizados a la versión corregida. Tu copia anterior queda guardada en Ajustes. <button class="btn" data-act="dismiss">Entendido</button></div>` : '') + (storeOK ? '' : `<div class="banner">Este navegador no permite guardar datos aquí. Antes de cerrar, exporta una copia desde Ajustes.</div>`);
  const body = view === 'cuentas' && !S.accounts.length ? `<div class="hero"><div class="l">Bienvenido a Finanzas</div><div class="v" style="font-size:22px">Tus datos, bajo tu control</div><div style="margin-top:8px">Importa tu copia JSON desde Ajustes para empezar en este dispositivo.</div><button class="btn primary" style="margin-top:14px;background:#fff;color:#075fc5" data-act="settings">Abrir Ajustes e importar copia</button></div>` : view === 'cuentas' ? viewAccounts() : view === 'movimientos' ? viewMoves() : view === 'informes' ? viewReports() : view === 'categorias' ? viewCategories() : viewSettings();
  $('#main').innerHTML = banner + body;
}

function refreshMoveSearch(){ const l=document.getElementById('list'); if(l) l.innerHTML=moveList(); const active=hasMoveSearch(); const q=document.getElementById('qsum'); if(q) q.innerHTML=active?qSummary():''; const x=document.querySelector('[data-clear-search="q"]'); if(x) x.style.visibility='visible'; }

document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-pknewsave]')) { pkNewSave(); return; }
  if (t.closest('[data-pknewcancel]')) { const o = PK && PK.o, sel = PK && PK.sel, cb = PK && PK.cb; pkOpen(sel, cb, o); return; }
  if (t.id === 'pk' || t.closest('[data-pkx]')) { pkClose(); return; }
  const pkr = t.closest('[data-pk]'); if (pkr) { pkPick(pkr.dataset.pk === '' ? null : Number(pkr.dataset.pk)); return; }
  const pko = t.closest('[data-pkopen]');
  if (pko) {
    const tid = pko.dataset.pkopen, inp = document.getElementById(tid), btn = document.getElementById(tid + '_b');
    const empty = pko.dataset.pkempty || null;
    let o = {};
    if (tid === 'c_par' || tid === 'c_into') {
      o.allow = new Set(S.categories.filter(x => FCAT == null || (x.id !== FCAT && !isDescOf(x.id, FCAT))).map(x => x.id));
      o.title = tid === 'c_par' ? 'Dentro de' : 'Fusionar en';
      o.none = tid === 'c_par' ? 'Ninguna (principal)' : false;
    }
    pkOpen(Number(inp.value) || null, id => { inp.value = id == null ? '' : id; btn.innerHTML = catBtn(id, empty); btn.classList.toggle('none', id == null); }, o);
    return;
  }
  const cal = t.closest('[data-calfor]');
  if (cal) { const i = document.getElementById(cal.dataset.calfor); if (i) { try { i.showPicker(); } catch (er) { i.focus(); i.click(); } } return; }
  const pkn = t.closest('[data-pknew]');
  if (pkn) { pkNewForm(); return; }
  const pks = t.closest('[data-pksplit]');
  if (pks && FSPL) { const i = Number(pks.dataset.pksplit); pkOpen(FSPL[i].category, id => { FSPL[i].category = id; splitUI(); }); return; }
  if (t.id === 'ov') { closeForm(); return; }
  const clearSearch = t.closest('[data-clear-search]'); if (clearSearch) { f.q=''; const inp=document.getElementById('q'); if(inp) inp.value=''; render(); return; }
  const rp = t.closest('[data-repdel]'); if (rp) { deleteReport(Number(rp.dataset.repdel)); return; }
  const rq = t.closest('[data-rep]'); if (rq) { applyReport(Number(rq.dataset.rep)); return; }
  const rex = t.closest('[data-rexp]'); if (rex) { const id = Number(rex.dataset.rexp); if (RCEXP.has(id)) RCEXP.delete(id); else RCEXP.add(id); const l = document.getElementById('rclist'); if (l) l.innerHTML = catPickInner(); return; }
  const rc = t.closest('[data-rc]'); if (rc) { toggleRepCat(Number(rc.dataset.rc)); return; }
  const k = t.closest('#kind button'); if (k) { FK = k.dataset.k; formUI(); return; }
  const tab = t.closest('[data-tab]'); if (tab) { go(tab.dataset.tab); return; }
  const mo = t.closest('[data-mo]'); if (mo) { f.month = shiftMonth(f.month, Number(mo.dataset.mo)); render(); return; }
  const ac = t.closest('[data-act]'); if (ac) { if (ac.dataset.act === 'duplicate') { const id = FID; if (id != null) openForm(id, true); return; } act(ac.dataset.act); return; }
  const gl = t.closest('[data-go]'); if (gl) { go(gl.dataset.go, Number(gl.dataset.acc)); return; }
  const mvb = t.closest('[data-move]'); if (mvb) { moveAcc(Number(mvb.dataset.acc), Number(mvb.dataset.move)); return; }
  const hp = t.closest('[data-hprice]'); if (hp) { editPrice(Number(hp.dataset.hprice)); return; }
  const sadd = t.closest('[data-sadd]'); if (sadd) { FSPL.push({category: null, amount: 0}); splitUI(); return; }
  const sdel = t.closest('[data-sdel]'); if (sdel) { FSPL.splice(Number(sdel.dataset.sdel), 1); if (!FSPL.length) FSPL = null; formUI(); return; }
  const ic = t.closest('[data-icon]'); if (ic) { FICON = ic.dataset.icon || null; $('#iconpick').innerHTML = iconPickHtml(); return; }
  const ctg = t.closest('[data-ctog]'); if (ctg) { const id = Number(ctg.dataset.ctog); if (CEXP.has(id)) CEXP.delete(id); else CEXP.add(id); $('#clist').innerHTML = catListHtml(); return; }
  const ct = t.closest('[data-cat]'); if (ct) { openCatForm(Number(ct.dataset.cat)); return; }
  const rg = t.closest('[data-rg]'); if (rg) { toggleRepAccGroup(Number(rg.dataset.rg)); return; }
  const ra = t.closest('[data-ra]'); if (ra) { toggleRepAcc(Number(ra.dataset.ra)); return; }
  const tx = t.closest('[data-tx]');
  if (tx && selMode) { const id = Number(tx.dataset.tx); if (SEL.has(id)) SEL.delete(id); else SEL.add(id); render(); return; }
  if (tx) { openForm(Number(tx.dataset.tx)); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rcq') { RCQ = e.target.value; const l = document.getElementById('rclist'); if (l) l.innerHTML = catPickInner(); return; }
  if (e.target.id === 'cq') { CQ = e.target.value; const l = document.getElementById('clist'); if (l) l.innerHTML = catListHtml(); return; }
  if (e.target.id === 'pkq') { const l = document.getElementById('pkl'); if (l) l.innerHTML = pkList(e.target.value); return; }
  // El importe se mantiene en dígitos mientras se escribe y se formatea al salir del campo.
  if (e.target.id === 'q') { f.q = e.target.value; refreshMoveSearch(); }
});
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el && el.dataset && el.dataset.money) {
    const digits = String(el.value || '').replace(/\\D/g, '');
    if (digits) el.value = digits;
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el && el.dataset && el.dataset.money) {
    el.value = moneyInputFormat(el.value);
  }
});
document.addEventListener('keydown', e => {
  if ((e.target.id === 'rfromt' || e.target.id === 'rtot') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'rsort') { S.reportSort = el.value; save(); openSavedReports(); return; }
  if (el.id === 'qfield') { f.field = el.value; const sf = SEARCH_FIELDS[f.field] || SEARCH_FIELDS.desc; const qi = document.getElementById('q'); if (qi) { qi.placeholder = sf[1]; qi.inputMode = sf[2]; qi.focus(); } if (hasMoveSearch()) render(); return; }
  if (el.id === 'accsel') { f.account = el.value ? Number(el.value) : null; render(); return; }
  if (el.id === 'rsel') { R.mode = el.value; if (R.mode === 'rango') { const r = pgRange(); R.from = r[0]; R.to = r[1]; } render(); return; }
  if (el.id === 'rfromt' || el.id === 'rtot') {
    const k = el.id === 'rfromt' ? 'from' : 'to';
    if (!el.value.trim()) { R[k] = null; render(); return; }
    const v = parseTypedDate(el.value);
    if (!v) { alert('Fecha no válida. Escríbela como dd/mm/aaaa'); render(); return; }
    R[el.id === 'rfromt' ? 'from' : 'to'] = v; render(); return;
  }
  if (el.id === 'rfrom' || el.id === 'rto') { R[el.id === 'rfrom' ? 'from' : 'to'] = el.value; render(); return; }
  if (el.id === 'rq') { R.q = el.value; render(); return; }
  if (el.id === 'rtipo') { R.tipo = el.value; render(); return; }
  if (el.id === 'rview') { R.view = el.value; render(); return; }
  if (el.dataset && el.dataset.sc != null && FSPL) { FSPL[Number(el.dataset.sc)].category = Number(el.value) || null; splitUI(); return; }
  if (el.dataset && el.dataset.sa != null && FSPL) { const sg = FK === 'gasto' ? -1 : 1; FSPL[Number(el.dataset.sa)].amount = sg * moneyDigits(el.value); splitUI(); return; }
  if (el.id === 'f_amt' && FSPL) splitUI();
});

S = loadState(); repairRefunds();
if (S.repState) { R.excl = new Set(S.repState.excl || []); R.cats = new Set(S.repState.cats || []); }
reindex();
save();
render();
if ((S.holdings || []).length) updatePrices();
</script>
